function answer(q){
  const s = q.toLowerCase();
  const total = POLICIES.reduce((a, p) => a + p.betrag, 0);
  if (/(prämie|praemie|kosten|preis|zahle|total)/.test(s)) {
    const hit = POLICIES.find((p) => p.tags.some((t) => s.includes(t)));
    if (hit) return 'Die Jahresprämie für ' + hit.produkt + ' beträgt ' + hit.praemie + ' (' + hit.gesellschaft + ', Police ' + hit.nr + ').';
    return 'Ihre sieben aktiven Policen kosten zusammen ' + chf(total) + ' pro Jahr. Grösster Posten: Berufliche Vorsorge.';
  }
  if (/(läuft|lauft|ablauf|abläuft|kündig|erneuer|frist|verlänger)/.test(s)) {
    return 'Als Erstes laufen vier Policen am 31.12.2026 ab: Sachversicherung, MFz-Flotte, Betriebs-Haftpflicht und Cyber-Risk. Für Cyber liegt bereits ein Erneuerungsvorschlag unter Dokumente.';
  }
  if (/(mitarbeiter|eintritt|anmeld|austritt)/.test(s)) {
    return 'Neue Mitarbeitende melden Sie bei der Police Berufliche Vorsorge an — Reiter "Mutation" auf der Policendetailseite.';
  }
  if (/(schaden|anliegen|unfall|bearbeitung)/.test(s)) {
    return 'Ein Fall ist in Bearbeitung: Wasserschaden Lagerhalle Ost (Sachversicherung, Emmental) — Gutachten liegt vor, die Auszahlung wird geprüft.';
  }
  if (/(rechnung|fällig|faellig|zahlung)/.test(s)) {
    return "Offen sind zwei Prämienrechnungen: MFz-Flotte CHF 6'279.50 (fällig 20.09.2026) und UVG-Zusatz CHF 234.80 (fällig 28.09.2026).";
  }
  const hit = POLICIES.find((p) => p.tags.some((t) => s.includes(t)) || s.includes(p.nr.toLowerCase()));
  if (hit) return hit.produkt + ' bei ' + hit.gesellschaft + ' (Police ' + hit.nr + '), ' + hit.praemie + ' pro Jahr, läuft bis ' + hit.ablauf + '.\n\n' + hit.deckung;
  if (/(versichert|deckung|gedeckt|abgedeckt)/.test(s)) {
    return 'Gedeckt sind Sach, Betriebs-Haftpflicht, MFz-Flotte, Cyber-Risk sowie Personal (BVG, UVG-Zusatz, Krankentaggeld). Nicht gedeckt: Betriebsunterbruch nach einem Cyber-Vorfall.';
  }
  return 'Dazu finde ich in Ihren Policen keine Angabe. Jan Krapl hilft weiter: 078 248 91 21 oder jkrapl@coverd.ch.';
}

function send(text){
  const q = (text || '').trim();
  if (!q) return;
  state.messages.push({ role: 'user', text: q });
  const a = answer(q);
  state.messages.push({ role: 'bot', text: a });
  speak(a);
  render();
}

  const el = document.getElementById('botInput');
  send(el.value);
  el.value = '';

}

var recognition = null;
function initRecognition(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) return null;
  const r = new Ctor();
  r.lang = 'de-CH';
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = function(e){ send(e.results[0][0].transcript); };
  r.onend = function(){ state.listening = false; render(); };
  r.onerror = function(){ state.listening = false; render(); };
  return r;
}
function toggleMic(){
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;
  if (state.listening) {
    recognition.stop();
    state.listening = false;
  } else {
    state.listening = true;
    recognition.start();
  }
  render();
}
function toggleVoiceOut(){
  state.voiceOut = !state.voiceOut;
  if (!state.voiceOut && window.speechSynthesis) window.speechSynthesis.cancel();
  render();
}
function speak(text){
  if (!state.voiceOut || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-CH';
  window.speechSynthesis.speak(u);
}

      <div class="card" style="display:flex; flex-direction:column; gap:12px;"><div style="font-size:17px; font-weight:600;">${t('Sicherheit','Security')}</div><p style="margin:0; font-size:15px; color:#6E6E6B; line-height:1.5;">${t('Einstellungen, mit denen Sie Ihr Konto schützen.','Settings that help you protect your account.')}</p><button class="pill-outline" style="align-self:flex-start; margin-top:6px;">${t('Anzeigen','View')}</button></div>
      <div class="help-dark"><div style="font-size:17px; font-weight:600;">${t('Lieber persönlich?','Prefer to talk in person?')}</div><p style="margin:0; font-size:15px; color:#B9B9B4; line-height:1.5;">Jan Krapl, 078 248 91 21, jkrapl@coverd.ch</p><button class="btn-white" onclick="alert(t('Rückruf angefordert (Demo).','Callback requested (demo).'))">${t('Rückruf anfordern','Request a callback')}</button></div>
    </div>
  </div>`;
}

function profilView(){
  const pt = state.profilTab;
  const tabs = [['allg', t('Allgemeine Informationen','General Information')],['sicher', t('Sicherheit','Security')],['benach', t('Benachrichtigungen','Notifications')]];
  const titleMap = { allg: t('Persönliche Informationen','Personal Information'), sicher: t('Sicherheit','Security'), benach: t('Benachrichtigungen','Notifications') };
  const subMap = { allg: t('Verwalten Sie Ihre persönlichen Angaben','Manage your personal details'), sicher: t('Einstellungen, mit denen Sie Ihr Konto schützen','Settings that help you protect your account'), benach: t('Bestimmen Sie, worüber wir Sie informieren','Decide what we keep you informed about') };
  const notifyDefs = [['schaden', t('Schadenfälle','Claims'), t('Statusänderungen und Auszahlungen','Status changes and payouts')], ['dokumente', t('Dokumente','Documents'), t('Neue Policen, Rechnungen und Belege','New policies, invoices and receipts')], ['policen', t('Policen','Policies'), t('Mutationen und Vertragsverlängerungen','Changes and contract renewals')], ['news', t('News','News'), t('Fachbeiträge und Hinweise','Articles and notices')]];
  return `
  <div style="display:flex; flex-wrap:wrap; gap:26px; align-items:flex-start;">
    <aside class="card" style="flex:1 1 280px; max-width:320px; padding:0; overflow:hidden;">
      <div style="padding:26px; display:flex; flex-direction:column; gap:14px; border-bottom:1px solid #E4E4E1;">
        <div style="width:64px; height:64px; border-radius:999px; background:#E8ECFF; color:#1F4FFF; display:grid; place-items:center; font-size:22px; font-weight:700;">LF</div>
        <div><div style="font-size:18px; font-weight:600;">Luca Ferrari</div><div style="font-size:14px; color:#6E6E6B; margin-top:3px;">Bachmann Metallbau AG</div></div>
        <span class="badge badge-ok" style="align-self:flex-start;">${t('Aktiv','Active')}</span>
      </div>
      <div style="padding:12px;">
        ${tabs.map(([k,l]) => `<button class="profil-tab ${pt===k?'active':''}" onclick="setProfilTab('${k}')">${l}</button>`).join('')}
      </div>
    </aside>
    <div class="card" style="flex:3 1 420px; min-width:0; padding:30px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;">
        <div><h2 style="margin:0; font-size:19px; font-weight:600;">${titleMap[pt]}</h2><p style="margin:8px 0 0; font-size:15px; color:#6E6E6B;">${subMap[pt]}</p></div>
        <button class="btn-blue-sm" onclick="alert(t('Gespeichert (Demo).','Saved (demo).'))">${t('Speichern','Save')}</button>
      </div>
      ${pt === 'allg' ? `
      <div class="grid-fields" style="margin-top:26px;">
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Vorname','First name')}</div><input class="input" value="Luca"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Nachname','Last name')}</div><input class="input" value="Ferrari"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Funktion','Role')}</div><input class="input" value="Geschäftsführer"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Telefon','Phone')}</div><input class="input" value="062 212 44 10"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('E-Mail','Email')}</div><input class="input" value="l.ferrari@bachmann-metallbau.ch"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Sprache','Language')}</div><input class="input" value="${t('Deutsch','German')}"></div>
      </div>` : ''}
      ${pt === 'sicher' ? `
      <div style="display:flex; flex-direction:column; gap:22px; margin-top:26px;">
        <div class="grid-fields">
          <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('E-Mail für die Anmeldung','Login email')}</div><input class="input" value="l.ferrari@bachmann-metallbau.ch"></div>
          <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Handynummer für die Zwei-Faktor-Anmeldung','Mobile number for two-factor login')}</div><input class="input" value="079 408 08 67"></div>
        </div>
        <div style="border-top:1px solid #F0F0EE; padding-top:22px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div><div style="font-size:16px; font-weight:600;">${t('Kennwort','Password')}</div><div style="font-size:14px; color:#6E6E6B; margin-top:4px;">${t('Zuletzt geändert am 02.02.2026','Last changed on 02.02.2026')}</div></div>
          <button class="pill-outline">${t('Jetzt ändern','Change now')}</button>
        </div>
      </div>` : ''}
      ${pt === 'benach' ? `
      <div style="display:flex; flex-direction:column; margin-top:26px;">
        ${notifyDefs.map(([key,titel,sub]) => { const on = state.notify[key]; return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 0; border-bottom:1px solid #F0F0EE;">
          <div><div style="font-size:16px; font-weight:600;">${titel}</div><div style="font-size:14px; color:#6E6E6B; margin-top:4px;">${sub}</div></div>
          <button class="toggle" style="background:${on?'#1F4FFF':'#DDDDD9'}; justify-content:${on?'flex-end':'flex-start'};" onclick="toggleNotify('${key}')"><span></span></button>
        </div>`; }).join('')}
      </div>` : ''}
    </div>
  </div>`;
}

function teamView(){
  const editingId = state.teamEditingId;
  const cards = state.team.map(m => editingId === m.id ? teamEditCard(m) : teamMemberCard(m)).join('');
  const addCard = editingId === 'new' ? teamEditCard(null) : `
    <button class="list-card" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:190px; color:#6E6E6B;" onclick="addTeamStart()">
      <span style="font-size:30px; line-height:1; color:#1F4FFF;">+</span>
      <span style="font-size:15px; font-weight:600;">${t('Verwalter hinzufügen','Add administrator')}</span>
    </button>`;
  return `
  <div style="display:flex; flex-direction:column; gap:26px;">
    <p style="margin:0; font-size:16px; color:#6E6E6B; max-width:640px;">${t('Bestimmen Sie, wer für Bachmann Metallbau AG auf das Coverd-Portal zugreifen kann — und mit welchen Berechtigungen.','Decide who can access the Coverd portal for Bachmann Metallbau AG — and with which permissions.')}</p>
    <div class="grid-cards">
      ${cards}
      ${addCard}
    </div>
    <div class="card" style="padding:28px;">
      <div style="font-size:17px; font-weight:600; margin-bottom:6px;">${t('Berechtigungsstufen im Überblick','Permission levels at a glance')}</div>
      <div style="display:flex; flex-direction:column;">
        ${Object.keys(ROLES).map(k => { const r = ROLES[k]; return `
        <div style="display:flex; align-items:flex-start; gap:18px; padding:16px 0; border-bottom:1px solid #F0F0EE;">
          <span class="badge" style="color:${r.fg}; background:${r.bg}; flex:none; min-width:170px; text-align:center;">${t(r.labelDe, r.labelEn)}</span>
          <div style="font-size:14px; color:#6E6E6B; line-height:1.5;">${t(r.descDe, r.descEn)}</div>
        </div>`; }).join('')}
      </div>
    </div>
  </div>`;
}

function teamMemberCard(m){
  const r = ROLES[m.role];
  return `
  <div class="list-card" style="cursor:default;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
      <div style="display:flex; gap:14px; align-items:center; min-width:0;">
        <div style="width:44px; height:44px; border-radius:999px; background:#E8ECFF; color:#1F4FFF; display:grid; place-items:center; font-size:15px; font-weight:700; flex:none;">${esc(initials(m.name))}</div>
        <div style="min-width:0;"><div style="font-size:16px; font-weight:600;">${esc(m.name)}</div><div style="font-size:13px; color:#6E6E6B; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(m.email)}</div></div>
      </div>
      <div style="display:flex; gap:2px; flex:none;">
        <button class="icon-btn" onclick="editTeamStart('${m.id}')" title="${t('Bearbeiten','Edit')}">✎</button>
        <button class="icon-btn" onclick="teamDelete('${m.id}')" title="${t('Entfernen','Remove')}">✕</button>
      </div>
    </div>
    <div style="border-top:1px solid #F0F0EE; margin-top:14px; padding-top:14px;">
      <span class="badge" style="color:${r.fg}; background:${r.bg};">${t(r.labelDe, r.labelEn)}</span>
    </div>
  </div>`;
}

function teamEditCard(m){
  const id = m ? m.id : 'new';
  const name = state.teamEditName;
  const email = state.teamEditEmail;
  const role = state.teamEditRole;
  return `
  <div class="list-card" style="cursor:default; display:flex; flex-direction:column; gap:12px;">
    <div><div style="font-size:13px; font-weight:600; margin-bottom:6px;">${t('Name','Name')}</div><input class="input" id="teamNameInput" placeholder="${t('Vor- und Nachname','First and last name')}" value="${esc(name)}"></div>
    <div><div style="font-size:13px; font-weight:600; margin-bottom:6px;">${t('E-Mail','Email')}</div><input class="input" id="teamEmailInput" placeholder="name@firma.ch" value="${esc(email)}"></div>
    <div><div style="font-size:13px; font-weight:600; margin-bottom:6px;">${t('Berechtigung','Permission')}</div>
      <select class="input" id="teamRoleInput" style="color:#0A0A0B;">
        ${Object.keys(ROLES).map(k => `<option value="${k}" ${k===role?'selected':''}>${t(ROLES[k].labelDe, ROLES[k].labelEn)}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex; gap:10px; margin-top:4px;">
      <button class="btn-blue-sm" onclick="teamSave('${id}')">${t('Speichern','Save')}</button>
      <button class="pill-outline" onclick="teamCancel()">${t('Abbrechen','Cancel')}</button>
    </div>
  </div>`;
}

function addTeamStart(){
  state.teamEditingId = 'new';
  state.teamEditName = '';
  state.teamEditEmail = '';
  state.teamEditRole = 'sachbearbeitung';
  render();
  const n = document.getElementById('teamNameInput'); if (n) n.focus();
}
function editTeamStart(id){
  const m = state.team.find(x => x.id === id);
  if (!m) return;
  state.teamEditingId = id;
  state.teamEditName = m.name;
  state.teamEditEmail = m.email;
  state.teamEditRole = m.role;
  render();
  const n = document.getElementById('teamNameInput'); if (n) n.focus();
}
function teamCancel(){
  state.teamEditingId = null;
  render();
}
function teamSave(id){
  const n = document.getElementById('teamNameInput');
  const e = document.getElementById('teamEmailInput');
  const r = document.getElementById('teamRoleInput');
  const name = (n ? n.value : '').trim();
  const email = (e ? e.value : '').trim();
  const role = r ? r.value : 'ansicht';
  if (!name) { if (n) n.focus(); return; }
  if (!email) { if (e) e.focus(); return; }
  if (id === 'new') {
    state.team.push({ id: 'm' + Date.now(), name, email, role });
  } else {
    const m = state.team.find(x => x.id === id);
    if (m) { m.name = name; m.email = email; m.role = role; }
  }
  state.teamEditingId = null;
  render();
}
function teamDelete(id){
  state.team = state.team.filter(x => x.id !== id);
  if (state.teamEditingId === id) state.teamEditingId = null;
  render();
}

function mainBody(){
  const policy = state.policy && POLICIES.find(p => p.key === state.policy);
  const claim = state.claim && CLAIMS.find(c => c.key === state.claim);
  if (state.screen === 'dash') return dashboardView();
  if (state.screen === 'policen') return policy ? policeDetailView() : policenListView();
  if (state.screen === 'schaden') return claim ? schadenDetailView() : schadenListView();
  if (state.screen === 'dokumente') return dokumenteView();
  if (state.screen === 'news') return newsView();
  if (state.screen === 'hilfe') return hilfeView();
  if (state.screen === 'profil') return profilView();
  if (state.screen === 'team') return teamView();
  return dashboardView();
}

function chatWidget(){
  return `
  <div class="chatbot">
    ${state.botOpen ? `
    <div class="chat-panel">
      <div class="chat-head">
        <div style="width:10px; height:10px; border-radius:999px; background:#1F4FFF; flex:none;"></div>
        <div style="min-width:0; flex:1 1 auto;"><div style="font-size:15px; font-weight:600;">${t('coverd Assistent','coverd Assistant')}</div><div style="font-size:13px; color:#6E6E6B;">${t('Antwortet aus Ihren Policen','Answers from your policies')}</div></div>
        <button onclick="toggleVoiceOut()" title="${state.voiceOut ? t('Antworten nicht mehr vorlesen','Stop reading answers aloud') : t('Antworten vorlesen','Read answers aloud')}" style="border:0; background:transparent; font-size:18px; color:#6E6E6B; cursor:pointer; line-height:1; padding:4px 6px; opacity:${state.voiceOut ? 1 : 0.4};">${state.voiceOut ? '🔊' : '🔈'}</button>
        <button onclick="closeBot()" style="border:0; background:transparent; font-size:20px; color:#6E6E6B; cursor:pointer; line-height:1; padding:4px 6px;">×</button>
      </div>
      <div class="chat-messages" id="botScroll">
        ${state.messages.map(m => `<div style="display:flex; justify-content:${m.role==='user'?'flex-end':'flex-start'};"><div class="chat-bubble" style="background:${m.role==='user'?'#0A0A0B':'#F3F3F1'}; color:${m.role==='user'?'#FFFFFF':'#0A0A0B'};">${esc(m.textDe !== undefined ? t(m.textDe, m.textEn) : m.text)}</div></div>`).join('')}
      </div>
      <div class="chat-foot">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="chip-suggest" onclick="send('Wie hoch ist meine Jahresprämie?')">${t('Wie hoch ist meine Jahresprämie?','What is my annual premium?')}</button>
          <button class="chip-suggest" onclick="send('Welche Police läuft zuerst ab?')">${t('Welche Police läuft zuerst ab?','Which policy expires first?')}</button>
        </div>
        <div style="display:flex; gap:10px;">
          <input id="botInput" class="input" placeholder="${state.listening ? t('Ich höre zu …','Listening …') : t('Frage zu Ihren Policen stellen','Ask a question about your policies')}" onkeydown="onBotKey(event)">
          ${(window.SpeechRecognition || window.webkitSpeechRecognition) ? `<button class="btn-mic ${state.listening ? 'listening' : ''}" onclick="toggleMic()" title="${state.listening ? t('Aufnahme stoppen','Stop recording') : t('Frage per Sprache stellen','Ask by voice')}">${state.listening ? '⏹️' : '🎤'}</button>` : ''}
          <button class="btn-blue-sm" onclick="sendFromInput()">${t('Senden','Send')}</button>
        </div>
      </div>
    </div>` : ''}
    <button class="fab" onclick="toggleBot()">${t('Fragen? Assistent öffnen','Questions? Open assistant')}</button>
  </div>`;
}

function render(){
  document.getElementById('app').innerHTML = `<div class="app-flex">${sidebar()}<div class="main-col">${topheader()}<main class="main-content">${mainBody()}</main></div></div>${chatWidget()}`;
  const sc = document.getElementById('botScroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
}

render();
</script>
</body>
</html>
