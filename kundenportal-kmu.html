<style>
  :root{
    --ink:#0B0B0C;
    --paper:#FFFFFF;
    --flat:#F2F2F4;
    --text:#0B0B0C;
    --grey:#3A3A3E;
    --meta:#68686D;
    --line:#E4E4E7;
    --line-soft:#F2F2F4;
    --input-border:#D4D4D8;
    --accent:#3D2BFF;
    --accent-hover:#2E1CE6;
    --accent-light:#EEECFF;
    --accent-dark:#2414B8;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--flat); font-family:'Archivo',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ color:var(--accent-hover); }
  button{ font-family:inherit; }
  input, textarea, select{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  h1,h2,h3{ font-family:'Archivo',sans-serif; margin:0; }

  .app{ display:flex; flex-direction:column; min-height:100vh; background:var(--flat); }
  .main-col{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .main{ padding:20px; max-width:1240px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:24px; }

  .sidebar{ width:100%; flex:none; background:var(--paper); border-bottom:1px solid var(--line); display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px; padding:14px 16px; overflow-x:auto; }
  .sidebar-logo{ padding:0; flex:none; }
  .sidebar-logo img{ height:22px; width:auto; display:block; }
  .sidebar-group-label{ display:none; }
  .sidebar-nav{ display:flex; flex-direction:row; flex-wrap:wrap; gap:4px; }
  .nav-item{ text-align:left; border:0; background:transparent; font:inherit; font-size:13px; font-weight:700; padding:9px 12px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap; color:var(--text); }
  .nav-item:hover{ background:var(--accent-light); color:var(--accent-dark); }
  .nav-item.active{ background:var(--accent-light); color:var(--accent-dark); }
  .nav-count{ font-size:12px; font-weight:700; color:var(--accent); }
  .nav-item.active .nav-count{ color:var(--accent-dark); }
  .sidebar-advisor{ display:none; }
  .sidebar-advisor img{ width:40px; height:40px; border-radius:999px; object-fit:cover; object-position:50% 22%; flex:none; }

  .topheader{ background:var(--paper); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
  .topheader .title{ font-size:20px; font-weight:700; }
  .topheader .crumb{ font-size:13px; color:var(--meta); margin-top:2px; }
  .header-right{ display:flex; align-items:center; gap:12px; margin-left:auto; flex-wrap:wrap; }
  .header-user{ display:flex; align-items:center; gap:10px; padding-left:14px; border-left:1px solid var(--line); }
  .avatar{ width:36px; height:36px; border-radius:999px; background:var(--accent-light); color:var(--accent-dark); display:grid; place-items:center; font-size:13px; font-weight:700; flex:none; }

  .btn{ border:0; font:inherit; font-weight:700; font-size:15px; padding:13px 20px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:10px; white-space:nowrap; }
  .btn-primary{ background:var(--accent); color:#FFFFFF; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-dark{ background:var(--ink); color:#FFFFFF; }
  .btn-dark:hover{ background:var(--accent); }
  .btn-outline{ background:var(--paper); border:1px solid var(--line); color:var(--text); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-sm{ padding:9px 16px; font-size:13px; }
  .btn-block{ width:100%; justify-content:center; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:26px; }
  .card-flat{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:0; overflow:hidden; }
  .card-click{ cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; display:block; width:100%; text-align:left; font:inherit; }
  .card-click:hover{ border-color:var(--accent); box-shadow:0 14px 36px rgba(11,11,12,.08); }
  .card-dashed{ background:#F7F6FF; border:1px dashed #BFB8FF; border-radius:16px; padding:26px; }

  .badge{ font-size:12px; font-weight:700; border-radius:999px; padding:5px 11px; display:inline-block; white-space:nowrap; }
  .badge-active{ color:var(--accent-dark); background:var(--accent-light); }
  .badge-pending{ color:var(--meta); background:var(--flat); }
  .badge-dark{ color:#FFFFFF; background:var(--ink); }
  .status-pill{ font-size:12px; font-weight:700; border-radius:999px; padding:5px 11px; white-space:nowrap; flex:none; }
  .status-pill-ready{ color:var(--accent-dark); background:var(--accent-light); }
  .status-pill-pending{ color:var(--meta); background:var(--flat); }

  .overline{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--meta); }

  .field-label{ font-size:14px; font-weight:700; margin-bottom:7px; }
  .input{ width:100%; height:48px; border:1px solid var(--input-border); border-radius:12px; padding:0 14px; font:inherit; font-size:15px; outline:none; background:var(--paper); color:var(--text); }
  .input:focus{ border-color:var(--accent); }
  textarea.input{ height:auto; min-height:84px; padding:14px; resize:vertical; }

  .upload-zone{ border:1px dashed #BFB8FF; background:#F7F6FF; border-radius:12px; padding:20px 16px; font-size:14px; color:var(--meta); text-align:center; }

  .switch{ flex:none; width:46px; height:26px; border-radius:999px; border:0; cursor:pointer; padding:3px; display:flex; }
  .switch span{ width:20px; height:20px; border-radius:999px; background:#FFFFFF; display:block; }

  .tab-pill{ border:1px solid var(--line); background:var(--paper); color:var(--text); font:inherit; font-size:14px; font-weight:700; padding:10px 16px; border-radius:999px; cursor:pointer; }
  .tab-pill:hover{ border-color:var(--accent); color:var(--accent); }
  .tab-pill.active{ background:var(--ink); color:#FFFFFF; border-color:var(--ink); }
  .tab-pill.active:hover{ color:#FFFFFF; }

  .filter-pill{ border:1px solid var(--line); background:var(--paper); font:inherit; font-size:14px; font-weight:600; padding:10px 16px; border-radius:999px; cursor:pointer; }
  .filter-pill:hover{ border-color:var(--accent); color:var(--accent); }
  .filter-pill.active{ background:var(--ink); color:#FFFFFF; border:0; }

  .status-icon-btn{ border:0; background:transparent; color:var(--meta); font:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:4px 6px; line-height:1; }
  .status-icon-btn:hover{ color:var(--ink); }
  .status-add-btn{ align-self:flex-start; margin-top:4px; }
  .round-icon-btn{ border:1px solid var(--line); background:var(--paper); width:32px; height:32px; border-radius:999px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; color:var(--meta); flex:none; }
  .round-icon-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .grid-2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr)); gap:24px; align-items:start; }
  .grid-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:16px; }
  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:16px; }
  .grid-docs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:16px; }
  .grid-news{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:20px; }
  .grid-fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:16px; }
  .stat-strip{ border-top:1px solid var(--line); background:#FAFAFB; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr)); }

  .stat-card{ display:flex; flex-direction:column; gap:10px; }
  .stat-card .stat-value{ font-size:34px; font-weight:700; letter-spacing:-0.01em; }
  .stat-card .stat-sub{ font-size:14px; color:var(--meta); }

  .doc-row:first-child{ border-top:0; }
  .doc-row:hover{ background:#FAFAFB; }

  .step-row{ display:flex; gap:14px; align-items:flex-start; padding-bottom:18px; }

  .step-circle.done{ background:var(--accent); color:#FFFFFF; }
  .step-circle.open{ background:var(--flat); color:var(--meta); }

  .help-blue-card .btn-white:hover{ background:var(--ink); color:#FFFFFF; }

  .profile-tab:hover{ background:var(--flat); }
  .profile-tab.active{ background:var(--accent-light); color:var(--accent-dark); }

  .chat-panel{ width:380px; max-width:calc(100vw - 48px); max-height:calc(100vh - 130px); background:var(--paper); border-radius:20px; box-shadow:0 24px 60px rgba(11,11,12,.18); overflow:hidden; display:flex; flex-direction:column; }
  .chat-head{ padding:18px 22px; background:var(--ink); color:#FFFFFF; display:flex; align-items:center; gap:12px; flex:none; }
  .chat-messages{ padding:20px 22px; display:flex; flex-direction:column; gap:14px; flex:1 1 auto; min-height:180px; max-height:340px; overflow-y:auto; background:var(--flat); }
  .chat-bubble{ font-size:15px; line-height:1.5; border-radius:14px; padding:12px 15px; max-width:88%; white-space:pre-line; }
  .chat-bubble.bot{ background:#FFFFFF; color:var(--text); }
  .chat-bubble.user{ background:var(--accent); color:#FFFFFF; }
  .chat-foot{ padding:14px 18px 18px; background:var(--paper); display:flex; flex-direction:column; gap:12px; flex:none; }
  .chip-suggest{ border:1px solid var(--line); background:var(--paper); font:inherit; font-size:13px; font-weight:600; padding:8px 13px; border-radius:999px; cursor:pointer; }
  .chip-suggest:hover{ border-color:var(--accent); color:var(--accent); }
  .fab{ border:0; background:var(--accent); color:#FFFFFF; font:inherit; font-size:15px; font-weight:700; padding:16px 22px; border-radius:999px; cursor:pointer; box-shadow:0 12px 30px rgba(61,43,255,.35); display:flex; align-items:center; gap:10px; }
  .fab:hover{ background:var(--accent-hover); }
  .fab-dot{ width:8px; height:8px; border-radius:999px; background:#FFFFFF; flex:none; }
  .round-btn{ border:1px solid var(--line); background:var(--paper); width:46px; height:46px; min-width:46px; border-radius:999px; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; flex:none; }

  .round-btn.listening{ background:#FDEAEA; border-color:#C81E1E; }
  .send-round{ border:0; background:var(--accent); color:#FFFFFF; width:46px; height:46px; min-width:46px; border-radius:999px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; flex:none; }
  .send-round:hover{ background:var(--accent-hover); }

</style>

function answer(q){
  const s = q.toLowerCase();
  const total = POLICIES.reduce((a, p) => a + p.betrag, 0);
  if (/(prämie|praemie|kosten|preis|zahle|total)/.test(s)) {
    const hit = POLICIES.find((p) => p.tags.some((t) => s.includes(t)));
    if (hit) return 'Die Jahresprämie für ' + hit.produkt + ' beträgt ' + hit.praemie + ' (' + hit.gesellschaft + ', Police ' + hit.nr + ').';
    return 'Ihre sieben aktiven Policen kosten zusammen ' + chf(total) + ' pro Jahr. Grösster Posten: Berufliche Vorsorge.';
  }
  if (/(läuft|lauft|ablauf|abläuft|kündig|erneuer|frist|verlänger)/.test(s)) {
    return 'Als Erstes laufen vier Policen am 31.12.2026 ab: Sachversicherung, MFz-Flotte, Betriebs-Haftpflicht und Cyber-Risk. Für Cyber liegt bereits ein Erneuerungsvorschlag unter Dokumente.';
  }
  if (/(mitarbeiter|eintritt|anmeld|austritt)/.test(s)) {
    return 'Neue Mitarbeitende melden Sie bei der Police Berufliche Vorsorge an — Reiter "Mutation" auf der Policendetailseite.';
  }
  if (/(schaden|anliegen|unfall|bearbeitung)/.test(s)) {
    return 'Ein Fall ist in Bearbeitung: Wasserschaden Lagerhalle Ost (Sachversicherung, Emmental) — Gutachten liegt vor, die Auszahlung wird geprüft.';
  }
  if (/(rechnung|fällig|faellig|zahlung)/.test(s)) {
    return "Offen sind zwei Prämienrechnungen: MFz-Flotte CHF 6'279.50 (fällig 20.09.2026) und UVG-Zusatz CHF 234.80 (fällig 28.09.2026).";
  }
  const hit = POLICIES.find((p) => p.tags.some((t) => s.includes(t)) || s.includes(p.nr.toLowerCase()));
  if (hit) return hit.produkt + ' bei ' + hit.gesellschaft + ' (Police ' + hit.nr + '), ' + hit.praemie + ' pro Jahr, läuft bis ' + hit.ablauf + '.\n\n' + hit.deckung;
  if (/(versichert|deckung|gedeckt|abgedeckt)/.test(s)) {
    return 'Gedeckt sind Sach, Betriebs-Haftpflicht, MFz-Flotte, Cyber-Risk sowie Personal (BVG, UVG-Zusatz, Krankentaggeld). Nicht gedeckt: Betriebsunterbruch nach einem Cyber-Vorfall.';
  }
  return 'Dazu finde ich in Ihren Policen keine Angabe. Jan Krapl hilft weiter: 078 248 91 21 oder jkrapl@coverd.ch.';
}

function send(text){
  const q = (text || '').trim();
  if (!q) return;
  state.messages.push({ role: 'user', text: q });
  const a = answer(q);
  state.messages.push({ role: 'bot', text: a });
  speak(a);
  render();
}

  el.value = '';

var recognition = null;
function initRecognition(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) return null;
  const r = new Ctor();
  r.lang = 'de-CH';
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = function(e){ send(e.results[0][0].transcript); };
  r.onend = function(){ state.listening = false; render(); };
  r.onerror = function(){ state.listening = false; render(); };
  return r;
}
function toggleMic(){
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;
  if (state.listening) {
    recognition.stop();
    state.listening = false;
  } else {
    state.listening = true;
    recognition.start();
  }
  render();
}
function toggleVoiceOut(){
  state.voiceOut = !state.voiceOut;
  if (!state.voiceOut && window.speechSynthesis) window.speechSynthesis.cancel();
  render();
}
function speak(text){
  if (!state.voiceOut || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-CH';
  window.speechSynthesis.speak(u);
}

  const tabs = [['allg', t('Allgemeine Informationen','General Information')],['sicher', t('Sicherheit','Security')],['benach', t('Benachrichtigungen','Notifications')]];
  const titleMap = { allg: t('Persönliche Informationen','Personal Information'), sicher: t('Sicherheit','Security'), benach: t('Benachrichtigungen','Notifications') };
  const subMap = { allg: t('Verwalten Sie Ihre persönlichen Angaben','Manage your personal details'), sicher: t('Einstellungen, mit denen Sie Ihr Konto schützen','Settings that help you protect your account'), benach: t('Bestimmen Sie, worüber wir Sie informieren','Decide what we keep you informed about') };
  const notifyDefs = [['schaden', t('Schadenfälle','Claims'), t('Statusänderungen und Auszahlungen','Status changes and payouts')], ['dokumente', t('Dokumente','Documents'), t('Neue Policen, Rechnungen und Belege','New policies, invoices and receipts')], ['policen', t('Policen','Policies'), t('Mutationen und Vertragsverlängerungen','Changes and contract renewals')], ['news', t('News','News'), t('Fachbeiträge und Hinweise','Articles and notices')]];
  return `
  <div style="display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start;">
    <aside class="card-flat" style="flex:1 1 280px; max-width:320px;">
      <div style="padding:26px; display:flex; flex-direction:column; gap:14px; border-bottom:1px solid var(--line);">
        <div style="width:52px; height:52px; border-radius:999px; background:var(--accent-light); color:var(--accent-dark); display:grid; place-items:center; font-size:19px; font-weight:700;">LF</div>
        <div><div style="font-size:18px; font-weight:700;">Luca Ferrari</div><div style="font-size:14px; color:var(--meta); margin-top:3px;">Bachmann Metallbau AG</div></div>
        <span class="badge badge-active" style="align-self:flex-start;">${t('Aktiv','Active')}</span>
      </div>
      <div style="padding:12px;">
        ${tabs.map(([k,l]) => `<button class="profile-tab ${pt===k?'active':''}" onclick="setProfilTab('${k}')">${l}</button>`).join('')}
      </div>
    </aside>
    <div class="card" style="flex:3 1 420px; min-width:0; padding:30px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;">
        <div><h2 style="font-size:22px; font-weight:700;">${titleMap[pt]}</h2><p style="margin:8px 0 0; font-size:15px; color:var(--meta);">${subMap[pt]}</p></div>
        <button class="btn btn-primary btn-sm" onclick="alert(t('Gespeichert (Demo).','Saved (demo).'))">${t('Speichern','Save')}</button>
      </div>
      ${pt === 'allg' ? `
      <div class="grid-fields" style="margin-top:26px;">
        <div><div class="field-label">${t('Vorname','First name')}</div><input class="input" value="Luca"></div>
        <div><div class="field-label">${t('Nachname','Last name')}</div><input class="input" value="Ferrari"></div>
        <div><div class="field-label">${t('Funktion','Role')}</div><input class="input" value="Geschäftsführer"></div>
        <div><div class="field-label">${t('Telefon','Phone')}</div><input class="input" value="062 212 44 10"></div>
        <div><div class="field-label">${t('E-Mail','Email')}</div><input class="input" value="l.ferrari@bachmann-metallbau.ch"></div>
        <div><div class="field-label">${t('Sprache','Language')}</div><input class="input" value="${t('Deutsch','German')}"></div>
      </div>` : ''}
      ${pt === 'sicher' ? `
      <div style="display:flex; flex-direction:column; gap:22px; margin-top:26px;">
        <div class="grid-fields">
          <div><div class="field-label">${t('E-Mail für die Anmeldung','Login email')}</div><input class="input" value="l.ferrari@bachmann-metallbau.ch"></div>
          <div><div class="field-label">${t('Handynummer für die Zwei-Faktor-Anmeldung','Mobile number for two-factor login')}</div><input class="input" value="079 408 08 67"></div>
        </div>
        <div style="border-top:1px solid var(--line-soft); padding-top:22px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div><div style="font-size:16px; font-weight:700;">${t('Kennwort','Password')}</div><div style="font-size:14px; color:var(--meta); margin-top:4px;">${t('Zuletzt geändert am 02.02.2026','Last changed on 02.02.2026')}</div></div>
          <button class="btn btn-outline btn-sm">${t('Jetzt ändern','Change now')}</button>
        </div>
      </div>` : ''}
      ${pt === 'benach' ? `
      <div style="display:flex; flex-direction:column; margin-top:26px;">
        ${notifyDefs.map(([key,titel,sub]) => { const on = state.notify[key]; return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 0; border-bottom:1px solid var(--line-soft);">
          <div><div style="font-size:16px; font-weight:700;">${titel}</div><div style="font-size:14px; color:var(--meta); margin-top:4px;">${sub}</div></div>
          <button class="switch" style="background:${on?'var(--accent)':'var(--input-border)'}; justify-content:${on?'flex-end':'flex-start'};" onclick="toggleNotify('${key}')"><span></span></button>
        </div>`; }).join('')}
      </div>` : ''}
    </div>
  </div>`;
}

function teamView(){
  const editingId = state.teamEditingId;
  const cards = state.team.map(m => editingId === m.id ? teamEditCard(m) : teamMemberCard(m)).join('');
  const addCard = editingId === 'new' ? teamEditCard(null) : `
    <button class="card card-click card-dashed" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:190px;" onclick="addTeamStart()">
      <span style="font-size:30px; line-height:1; color:var(--accent-dark);">+</span>
      <span style="font-size:15px; font-weight:700; color:var(--accent-dark);">${t('Verwalter hinzufügen','Add administrator')}</span>
    </button>`;
  return `
  <div style="display:flex; flex-direction:column; gap:26px;">
    <p style="margin:0; font-size:16px; color:var(--meta); max-width:640px;">${t('Bestimmen Sie, wer für Bachmann Metallbau AG auf das Coverd-Portal zugreifen kann — und mit welchen Berechtigungen.','Decide who can access the Coverd portal for Bachmann Metallbau AG — and with which permissions.')}</p>
    <div class="grid-cards">
      ${cards}
      ${addCard}
    </div>
    <div class="card">
      <div style="font-size:17px; font-weight:700; margin-bottom:6px;">${t('Berechtigungsstufen im Überblick','Permission levels at a glance')}</div>
      <div style="display:flex; flex-direction:column;">
        ${Object.keys(ROLES).map(k => { const r = ROLES[k]; return `
        <div style="display:flex; align-items:flex-start; gap:18px; padding:16px 0; border-bottom:1px solid var(--line-soft);">
          <span class="badge" style="color:${r.fg}; background:${r.bg}; flex:none; min-width:170px; text-align:center;">${t(r.labelDe, r.labelEn)}</span>
          <div style="font-size:14px; color:var(--meta); line-height:1.5;">${t(r.descDe, r.descEn)}</div>
        </div>`; }).join('')}
      </div>
    </div>
  </div>`;
}

function teamMemberCard(m){
  const r = ROLES[m.role];
  return `
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
      <div style="display:flex; gap:14px; align-items:center; min-width:0;">
        <div style="width:44px; height:44px; border-radius:999px; background:var(--accent-light); color:var(--accent-dark); display:grid; place-items:center; font-size:15px; font-weight:700; flex:none;">${esc(initials(m.name))}</div>
        <div style="min-width:0;"><div style="font-size:16px; font-weight:700;">${esc(m.name)}</div><div style="font-size:13px; color:var(--meta); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(m.email)}</div></div>
      </div>
      <div style="display:flex; gap:6px; flex:none;">
        <button class="round-icon-btn" onclick="editTeamStart('${m.id}')" title="${t('Bearbeiten','Edit')}">✎</button>
        <button class="round-icon-btn" onclick="teamDelete('${m.id}')" title="${t('Entfernen','Remove')}">✕</button>
      </div>
    </div>
    <div style="border-top:1px solid var(--line-soft); margin-top:14px; padding-top:14px;">
      <span class="badge" style="color:${r.fg}; background:${r.bg};">${t(r.labelDe, r.labelEn)}</span>
    </div>
  </div>`;
}

function teamEditCard(m){
  const id = m ? m.id : 'new';
  const name = state.teamEditName;
  const email = state.teamEditEmail;
  const role = state.teamEditRole;
  return `
  <div class="card" style="display:flex; flex-direction:column; gap:12px;">
    <div><div class="field-label">${t('Name','Name')}</div><input class="input" id="teamNameInput" placeholder="${t('Vor- und Nachname','First and last name')}" value="${esc(name)}"></div>
    <div><div class="field-label">${t('E-Mail','Email')}</div><input class="input" id="teamEmailInput" placeholder="name@firma.ch" value="${esc(email)}"></div>
    <div>
      <div class="field-label">${t('Berechtigung','Permission')}</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${Object.keys(ROLES).map(k => `<button type="button" class="filter-pill ${k===role?'active':''}" onclick="setTeamRole('${k}')">${t(ROLES[k].labelDe, ROLES[k].labelEn)}</button>`).join('')}
      </div>
    </div>
    <div style="display:flex; gap:10px; margin-top:4px;">
      <button class="btn btn-primary btn-sm" onclick="teamSave('${id}')">${t('Speichern','Save')}</button>
      <button class="btn btn-outline btn-sm" onclick="teamCancel()">${t('Abbrechen','Cancel')}</button>
    </div>
  </div>`;
}

function syncTeamEditFields(){
  const n = document.getElementById('teamNameInput');
  const e = document.getElementById('teamEmailInput');
  if (n) state.teamEditName = n.value;
  if (e) state.teamEditEmail = e.value;
}
function setTeamRole(role){
  syncTeamEditFields();
  state.teamEditRole = role;
  render();
  const n = document.getElementById('teamNameInput'); if (n) n.focus();
}
function addTeamStart(){
  state.teamEditingId = 'new';
  state.teamEditName = '';
  state.teamEditEmail = '';
  state.teamEditRole = 'sachbearbeitung';
  render();
  const n = document.getElementById('teamNameInput'); if (n) n.focus();
}
function editTeamStart(id){
  const m = state.team.find(x => x.id === id);
  if (!m) return;
  state.teamEditingId = id;
  state.teamEditName = m.name;
  state.teamEditEmail = m.email;
  state.teamEditRole = m.role;
  render();
  const n = document.getElementById('teamNameInput'); if (n) n.focus();
}
function teamCancel(){
  state.teamEditingId = null;
  render();
}
function teamSave(id){
  syncTeamEditFields();
  const name = state.teamEditName.trim();
  const email = state.teamEditEmail.trim();
  const role = state.teamEditRole;
  if (!name) { const n = document.getElementById('teamNameInput'); if (n) n.focus(); return; }
  if (!email) { const e = document.getElementById('teamEmailInput'); if (e) e.focus(); return; }
  if (id === 'new') {
    state.team.push({ id: 'm' + Date.now(), name, email, role });
  } else {
    const m = state.team.find(x => x.id === id);
    if (m) { m.name = name; m.email = email; m.role = role; }
  }
  state.teamEditingId = null;
  render();
}
function teamDelete(id){
  state.team = state.team.filter(x => x.id !== id);
  if (state.teamEditingId === id) state.teamEditingId = null;
  render();
}

function mainBody(){
  const policy = state.policy && POLICIES.find(p => p.key === state.policy);
  const claim = state.claim && CLAIMS.find(c => c.key === state.claim);
  if (state.screen === 'dash') return dashboardView();
  if (state.screen === 'policen') return policy ? policeDetailView() : policenListView();
  if (state.screen === 'schaden') return claim ? schadenDetailView() : schadenListView();
  if (state.screen === 'dokumente') return dokumenteView();
  if (state.screen === 'news') return newsView();
  if (state.screen === 'hilfe') return hilfeView();
  if (state.screen === 'profil') return profilView();
  if (state.screen === 'team') return teamView();
  return dashboardView();
}

function chatWidget(){
  return `
  <div class="chatbot">
    ${state.botOpen ? `
    <div class="chat-panel">
      <div class="chat-head">
        <div style="width:10px; height:10px; border-radius:999px; background:#6B5BFF; flex:none;"></div>
        <div style="min-width:0; flex:1 1 auto;"><div style="font-size:15px; font-weight:700;">${t('coverd Assistent','coverd Assistant')}</div><div style="font-size:13px; color:#C9C5FF;">${t('Antwortet aus Ihren Policen','Answers from your policies')}</div></div>
        <button onclick="toggleVoiceOut()" title="${state.voiceOut ? t('Antworten nicht mehr vorlesen','Stop reading answers aloud') : t('Antworten vorlesen','Read answers aloud')}" style="border:0; background:transparent; font-size:18px; color:#FFFFFF; cursor:pointer; line-height:1; padding:4px 6px; opacity:${state.voiceOut ? 1 : 0.5};">${state.voiceOut ? '🔊' : '🔈'}</button>
        <button onclick="closeBot()" style="border:0; background:transparent; font-size:20px; color:#FFFFFF; cursor:pointer; line-height:1; padding:4px 6px;">×</button>
      </div>
      <div class="chat-messages" id="botScroll">
        ${state.messages.map(m => `<div style="display:flex; justify-content:${m.role==='user'?'flex-end':'flex-start'};"><div class="chat-bubble ${m.role==='user'?'user':'bot'}">${esc(m.textDe !== undefined ? t(m.textDe, m.textEn) : m.text)}</div></div>`).join('')}
      </div>
      <div class="chat-foot">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="chip-suggest" onclick="send('Wie hoch ist meine Jahresprämie?')">${t('Wie hoch ist meine Jahresprämie?','What is my annual premium?')}</button>
          <button class="chip-suggest" onclick="send('Welche Police läuft zuerst ab?')">${t('Welche Police läuft zuerst ab?','Which policy expires first?')}</button>
        </div>
        <div class="chat-input-row" style="display:flex; gap:8px; align-items:center;">
          <input id="botInput" class="input" style="border-radius:999px;" placeholder="${state.listening ? t('Ich höre zu …','Listening …') : t('Frage zu Ihren Policen stellen','Ask a question about your policies')}" onkeydown="onBotKey(event)">
          ${(window.SpeechRecognition || window.webkitSpeechRecognition) ? `<button class="round-btn ${state.listening ? 'listening' : ''}" onclick="toggleMic()" title="${state.listening ? t('Aufnahme stoppen','Stop recording') : t('Frage per Sprache stellen','Ask by voice')}">${state.listening ? '⏹️' : '🎤'}</button>` : ''}
          <button class="send-round" onclick="sendFromInput()" title="${t('Senden','Send')}">➤</button>
        </div>
      </div>
    </div>` : ''}
    <button class="fab" onclick="toggleBot()"><span class="fab-dot"></span>${t('Fragen? Assistent','Questions? Assistant')}</button>
  </div>`;
}

function render(){
  document.title = t('Kundenportal – coverd ag','Customer Portal – coverd ag');
  document.getElementById('app').innerHTML = `<div class="app">${sidebar()}<div class="main-col">${topheader()}<main class="main">${mainBody()}</main></div></div>${chatWidget()}`;
  const sc = document.getElementById('botScroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
}

render();
</script>
</body>
</html>
