<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kundenportal – coverd ag</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{ margin:0; background:#F3F3F1; font-family:'Instrument Sans','Helvetica Neue',Helvetica,sans-serif; color:#0A0A0B; -webkit-font-smoothing:antialiased; }
  *{ box-sizing:border-box; }
  a{ color:#3D2BFF; text-decoration:none; }
  a:hover{ color:#0A0A0B; }
  button{ font-family:inherit; }
  input, textarea{ font-family:inherit; }

  .app-flex{ display:flex; flex-direction:column; min-height:100vh; background:#F3F3F1; }

  .sidebar{ width:100%; flex:none; background:#161BFD; color:#FFFFFF; display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:14px 16px; }
  .sidebar-logo{ padding:0; flex:none; }
  .sidebar-logo-box{ width:132px; height:34px; overflow:hidden; position:relative; background:#FFFFFF; border-radius:8px; }
  .sidebar-label{ display:none; }
  .sidebar-nav{ display:flex; flex-direction:row; flex-wrap:wrap; gap:6px; }
  .nav-item{ text-align:left; border:0; background:transparent; font:inherit; font-size:13px; font-weight:500; padding:9px 12px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:8px; width:auto; white-space:nowrap; }
  .nav-item:hover{ background:#0B0EE1; }
  .nav-item .dot{ width:8px; height:8px; border-radius:2px; flex:none; }
  .sidebar-advisor{ display:none; }
  .sidebar-advisor img{ width:40px; height:40px; border-radius:999px; object-fit:cover; object-position:50% 22%; flex:none; }

  .main-col{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .topheader{ background:#FFFFFF; border-bottom:1px solid #E4E4E1; padding:14px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
  .topheader .title{ font-size:20px; font-weight:600; }
  .topheader .crumb{ font-size:14px; color:#6E6E6B; margin-top:2px; }
  .btn-dark{ border:0; background:#0A0A0B; color:#FFFFFF; font:inherit; font-size:15px; font-weight:600; padding:11px 20px; border-radius:999px; cursor:pointer; white-space:nowrap; flex:none; }
  .btn-dark:hover{ background:#3D2BFF; }
  .header-user{ display:flex; align-items:center; gap:10px; padding-left:14px; border-left:1px solid #E4E4E1; }
  .avatar{ width:36px; height:36px; border-radius:999px; background:#F5F4FF; color:#3D2BFF; display:grid; place-items:center; font-size:13px; font-weight:700; flex:none; }

  main.main-content{ padding:20px; max-width:1280px; width:100%; }

  .card{ border:1px solid #E4E4E1; background:#FFFFFF; border-radius:22px; padding:26px; }
  .list-card{ border:1px solid #E4E4E1; background:#FFFFFF; border-radius:20px; padding:24px; cursor:pointer; font:inherit; text-align:left; width:100%; }
  .list-card:hover{ border-color:#0A0A0B; }
  .doc-card{ border:1px solid #E4E4E1; background:#FFFFFF; border-radius:18px; padding:22px; display:flex; flex-direction:column; gap:12px; }
  .doc-card:hover{ border-color:#0A0A0B; }
  .pill-outline{ border:1px solid #E4E4E1; background:#FFFFFF; font:inherit; font-size:14px; font-weight:600; padding:10px 16px; border-radius:999px; cursor:pointer; }
  .pill-outline:hover{ border-color:#0A0A0B; }
  .tab-pill{ border:1px solid #E4E4E1; background:#FFFFFF; color:#0A0A0B; font:inherit; font-size:15px; font-weight:600; padding:11px 18px; border-radius:999px; cursor:pointer; }
  .tab-pill:hover{ border-color:#0A0A0B; }
  .tab-pill.active{ background:#0A0A0B; color:#FFFFFF; border-color:#0A0A0B; }
  .filter-pill{ border:1px solid #E4E4E1; background:#FFFFFF; font:inherit; font-size:15px; font-weight:500; padding:11px 18px; border-radius:999px; cursor:pointer; }
  .filter-pill:hover{ border-color:#0A0A0B; }
  .filter-pill.active{ background:#0A0A0B; color:#FFFFFF; border:0; }
  .badge{ font-size:13px; font-weight:600; border-radius:999px; padding:6px 12px; display:inline-block; }
  .badge-ok{ color:#16603A; background:#DDF3E6; }
  .badge-pending{ color:#6E6E6B; background:#F3F3F1; }
  .micro{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#6E6E6B; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .input{ width:100%; border:1px solid #E4E4E1; border-radius:12px; padding:13px 16px; font:inherit; font-size:15px; outline:none; }
  .input:focus{ border-color:#3D2BFF; }
  .btn-blue{ border:0; background:#3D2BFF; color:#FFFFFF; font:inherit; font-weight:600; padding:14px 22px; border-radius:12px; cursor:pointer; }
  .btn-blue:hover{ background:#0A0A0B; }
  .btn-blue-sm{ border:0; background:#3D2BFF; color:#FFFFFF; font:inherit; font-size:15px; font-weight:600; padding:12px 18px; border-radius:12px; cursor:pointer; }
  .btn-blue-sm:hover{ background:#0A0A0B; }
  .dropzone{ border:1px dashed #C9C9C5; border-radius:12px; padding:20px 16px; font-size:15px; color:#6E6E6B; text-align:center; }
  .toggle{ flex:none; width:52px; height:30px; border-radius:999px; border:0; cursor:pointer; padding:3px; display:flex; }
  .toggle span{ width:24px; height:24px; border-radius:999px; background:#FFFFFF; display:block; }
  .profil-tab{ width:100%; text-align:left; border:0; background:transparent; font:inherit; font-size:15px; font-weight:500; padding:13px 16px; border-radius:12px; cursor:pointer; }
  .profil-tab:hover{ background:#F3F3F1; }
  .profil-tab.active{ background:#F3F3F1; color:#3D2BFF; }
  .help-dark{ border:1px solid #0A0A0B; background:#0A0A0B; color:#FFFFFF; border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:12px; }
  .help-dark .btn-white{ align-self:flex-start; margin-top:6px; border:0; background:#FFFFFF; color:#0A0A0B; font:inherit; font-size:14px; font-weight:600; padding:10px 18px; border-radius:999px; cursor:pointer; }
  .help-dark .btn-white:hover{ background:#3D2BFF; color:#FFFFFF; }
  .status-list{ display:flex; flex-direction:column; }
  .status-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 0; border-bottom:1px solid #F0F0EE; }
  .status-row:first-child{ padding-top:2px; }
  .status-row:last-child{ padding-bottom:2px; border-bottom:0; }
  .status-pill{ font-size:13px; font-weight:600; border-radius:999px; padding:6px 14px; white-space:nowrap; flex:none; }
  .status-pill-ready{ color:#3D2BFF; background:#F5F4FF; }
  .status-pill-pending{ color:#6E6E6B; background:#F3F3F1; }
  .status-icon-btn{ border:0; background:transparent; color:#9A9A96; font-size:14px; cursor:pointer; padding:4px 6px; line-height:1; }
  .status-icon-btn:hover{ color:#0A0A0B; }
  .status-add-btn{ align-self:flex-start; margin-top:14px; border:1px dashed #C9C9C5; background:transparent; color:#6E6E6B; font:inherit; font-size:14px; font-weight:600; padding:10px 16px; border-radius:999px; cursor:pointer; }
  .status-add-btn:hover{ border-color:#3D2BFF; color:#3D2BFF; }
  .status-edit-row{ display:flex; flex-direction:column; gap:10px; padding:16px 0; }
  .status-edit-row-fields{ display:flex; gap:10px; flex-wrap:wrap; }
  .status-edit-input{ flex:1 1 200px; border:1px solid #E4E4E1; background:#FFFFFF; color:#0A0A0B; border-radius:10px; padding:10px 14px; font:inherit; font-size:14px; outline:none; }
  .status-edit-input:focus{ border-color:#3D2BFF; }
  .status-edit-input::placeholder{ color:#9A9A96; }
  .status-kind-toggle{ display:flex; gap:8px; }
  .status-kind-btn{ border:1px solid #E4E4E1; background:transparent; color:#6E6E6B; font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; }
  .status-kind-btn.active-ready{ background:#F5F4FF; border-color:#3D2BFF; color:#3D2BFF; }
  .status-kind-btn.active-pending{ background:#F3F3F1; border-color:#6E6E6B; color:#6E6E6B; }
  .status-edit-actions{ display:flex; gap:10px; }
  .status-btn-save{ border:0; background:#3D2BFF; color:#FFFFFF; font:inherit; font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px; cursor:pointer; }
  .status-btn-save:hover{ background:#0A0A0B; }
  .status-btn-cancel{ border:0; background:transparent; color:#6E6E6B; font:inherit; font-size:13px; font-weight:600; padding:9px 12px; cursor:pointer; }
  .status-btn-cancel:hover{ color:#0A0A0B; }

  .grid-2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
  .grid-docs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .grid-news{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; }
  .grid-fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .stat-strip{ border-top:1px solid #E4E4E1; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .stat-cell{ padding:20px 30px; border-right:1px solid #F0F0EE; }

  .chatbot{ position:fixed; right:24px; bottom:24px; z-index:40; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
  .chat-panel{ width:380px; max-width:calc(100vw - 48px); max-height:calc(100vh - 130px); background:#FFFFFF; border:1px solid #E4E4E1; border-radius:22px; box-shadow:0 24px 60px rgba(10,10,11,0.16); overflow:hidden; display:flex; flex-direction:column; }
  .chat-head{ padding:18px 22px; border-bottom:1px solid #E4E4E1; display:flex; align-items:center; gap:12px; flex:none; }
  .chat-messages{ padding:20px 22px; display:flex; flex-direction:column; gap:14px; flex:1 1 auto; min-height:180px; max-height:340px; overflow-y:auto; }
  .chat-bubble{ font-size:15px; line-height:1.5; border-radius:14px; padding:12px 15px; max-width:88%; white-space:pre-line; }
  .chat-foot{ padding:14px 22px 20px; border-top:1px solid #E4E4E1; display:flex; flex-direction:column; gap:12px; flex:none; }
  .chip-suggest{ border:1px solid #E4E4E1; background:#FFFFFF; font:inherit; font-size:13px; font-weight:500; padding:8px 13px; border-radius:999px; cursor:pointer; }
  .chip-suggest:hover{ border-color:#0A0A0B; }
  .fab{ border:0; background:#0A0A0B; color:#FFFFFF; font:inherit; font-size:15px; font-weight:600; padding:16px 24px; border-radius:999px; cursor:pointer; box-shadow:0 12px 32px rgba(10,10,11,0.22); }
  .btn-mic{ border:1px solid #E4E4E1; background:#FFFFFF; width:46px; height:46px; min-width:46px; border-radius:12px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex:none; }
  .btn-mic.listening{ background:#FFECEC; border-color:#E23B3B; }
  .fab:hover{ background:#3D2BFF; }

  @media (min-width:901px){
    .app-flex{ flex-direction:row; }
    .sidebar{ width:248px; flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:0; padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .sidebar-logo{ padding:0 22px 28px; }
    .sidebar-label{ display:block; padding:0 22px 10px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#E8E9FF; }
    .sidebar-label.spaced{ padding-top:26px; }
    .sidebar-nav{ flex-direction:column; gap:2px; padding:0 12px; }
    .nav-item{ font-size:15px; padding:12px 14px; white-space:normal; }
    .sidebar-advisor{ display:flex; margin-top:auto; padding:22px 22px 0; border-top:1px solid #474CFF; align-items:center; gap:12px; }
    main.main-content{ padding:36px; }
    .topheader{ padding:18px 36px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
const state = {
  loggedIn: false, loginError: false,
  screen: 'dash', policy: null, claim: null, detailTab: 'ueber', profilTab: 'allg',
  lang: 'de',
  notify: { schaden: true, policen: true, news: false },
  botOpen: false,
  listening: false,
  voiceOut: false,
  messages: [],
  policies: [],
  claims: [],
  verlauf: [],
  policyUploadBusy: false,
  themen: [],
  themaEditingId: null,
  themaEditLabel: '',
  themaEditStatus: '',
  themaEditKind: 'ready',
  uploadedDocName: null,
  uploadedDocText: null,
  uploadedDocStatus: null
};

const STORAGE_KEY = 'coverd_privat_portal_v1';
function persist(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      policies: state.policies,
      claims: state.claims,
      verlauf: state.verlauf,
      themen: state.themen,
      notify: state.notify
    }));
  } catch (e) {}
}
function loadPersisted(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.policies) state.policies = saved.policies.filter(function(p){ return !p.reading; });
    if (saved.claims) state.claims = saved.claims;
    if (saved.verlauf) state.verlauf = saved.verlauf;
    if (saved.themen) state.themen = saved.themen;
    if (saved.notify) state.notify = saved.notify;
    persist();
  } catch (e) {}
}
function approvePolicy(key){
  const p = state.policies.find(x => x.key === key);
  if (!p) return;
  p.pending = false;
  state.verlauf.push({ initialen: 'JK', bg: '#F5F4FF', fg: '#3D2BFF', name: 'Jan Krapl', zeit: nowStr(), text: t('Ihre Police „' + t(p.produkt, p.produktEn) + '“ wurde geprüft und ist jetzt aktiv.', 'Your "' + t(p.produkt, p.produktEn) + '" policy has been reviewed and is now active.') });
  persist();
  render();
}
function deletePolicy(key){
  const p = state.policies.find(x => x.key === key);
  if (!p) return;
  const label = t(p.produkt, p.produktEn);
  if (!confirm(p.pending
    ? t('Diese hochgeladene Police wirklich ablehnen und entfernen?','Really reject and remove this uploaded policy?')
    : t('Diese Police „' + label + '“ wirklich löschen?','Really delete the "' + label + '" policy?'))) return;
  state.policies = state.policies.filter(x => x.key !== key);
  state.verlauf.push({ initialen: 'JK', bg: '#F5F4FF', fg: '#3D2BFF', name: 'Jan Krapl', zeit: nowStr(), text: p.pending
    ? t('Die hochgeladene Police „' + label + '“ konnte nicht bestätigt werden. Bitte laden Sie das Dokument erneut hoch oder melden Sie sich bei Jan Krapl.', 'The uploaded "' + label + '" policy could not be confirmed. Please re-upload the document or contact Jan Krapl.')
    : t('Die Police „' + label + '“ wurde auf Ihren Wunsch entfernt.', 'The "' + label + '" policy has been removed at your request.') });
  state.policy = null;
  state.screen = 'policen';
  persist();
  render();
}

function t(de, en){ return state.lang === 'en' ? en : de; }
function toggleLang(){ state.lang = state.lang === 'de' ? 'en' : 'de'; render(); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function themenCard(){
  const editingId = state.themaEditingId;
  const rows = state.themen.map(th => editingId === th.id ? themaEditRow(th) : `
    <div class="status-row">
      <span style="font-size:16px; color:#0A0A0B;">${esc(t(th.label, th.labelEn || th.label))}</span>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="status-pill status-pill-${th.kind}">${esc(t(th.status, th.statusEn || th.status))}</span>
        <button class="status-icon-btn" onclick="editThemaStart('${th.id}')" title="${t('Bearbeiten','Edit')}">✎</button>
        <button class="status-icon-btn" onclick="themaDelete('${th.id}')" title="${t('Entfernen','Remove')}">✕</button>
      </div>
    </div>`).join('');
  const addRow = editingId === 'new' ? themaEditRow(null) : `<button class="status-add-btn" onclick="addThemaStart()">+ ${t('Thema hinzufügen','Add topic')}</button>`;
  return `
  <div class="card" style="display:flex; flex-direction:column; gap:12px;">
    <div style="font-size:17px; font-weight:600;">${t('Für Sie in Vorbereitung','Being prepared for you')}</div>
    <div class="status-list">${rows}</div>
    ${addRow}
  </div>`;
}

function themaEditRow(th){
  const id = th ? th.id : 'new';
  const label = state.themaEditLabel;
  const status = state.themaEditStatus;
  const kind = state.themaEditKind;
  return `
  <div class="status-edit-row">
    <div class="status-edit-row-fields">
      <input class="status-edit-input" id="themaLabelInput" placeholder="${t('Thema (z. B. Vergleich Gebäudeversicherung)','Topic (e.g. building insurance comparison)')}" value="${esc(label)}">
      <input class="status-edit-input" id="themaStatusInput" placeholder="${t('Status (z. B. Bereit)','Status (e.g. Ready)')}" value="${esc(status)}">
    </div>
    <div class="status-kind-toggle">
      <button type="button" class="status-kind-btn ${kind==='ready'?'active-ready':''}" onclick="setThemaKind('ready')">${t('Blau','Blue')}</button>
      <button type="button" class="status-kind-btn ${kind==='pending'?'active-pending':''}" onclick="setThemaKind('pending')">${t('Grau','Gray')}</button>
    </div>
    <div class="status-edit-actions">
      <button class="status-btn-save" onclick="themaSave('${id}')">${t('Speichern','Save')}</button>
      <button class="status-btn-cancel" onclick="themaCancel()">${t('Abbrechen','Cancel')}</button>
    </div>
  </div>`;
}

function syncThemaEditFields(){
  const l = document.getElementById('themaLabelInput');
  const s = document.getElementById('themaStatusInput');
  if (l) state.themaEditLabel = l.value;
  if (s) state.themaEditStatus = s.value;
}
function addThemaStart(){
  state.themaEditingId = 'new';
  state.themaEditLabel = '';
  state.themaEditStatus = '';
  state.themaEditKind = 'ready';
  render();
  const l = document.getElementById('themaLabelInput'); if (l) l.focus();
}
function editThemaStart(id){
  const th = state.themen.find(x => x.id === id);
  if (!th) return;
  state.themaEditingId = id;
  state.themaEditLabel = th.label;
  state.themaEditStatus = th.status;
  state.themaEditKind = th.kind;
  render();
  const l = document.getElementById('themaLabelInput'); if (l) l.focus();
}
function setThemaKind(k){
  syncThemaEditFields();
  state.themaEditKind = k;
  render();
  const l = document.getElementById('themaLabelInput'); if (l) l.focus();
}
function themaCancel(){
  state.themaEditingId = null;
  render();
}
function themaSave(id){
  syncThemaEditFields();
  const label = state.themaEditLabel.trim();
  let status = state.themaEditStatus.trim();
  if (!label) { const l = document.getElementById('themaLabelInput'); if (l) l.focus(); return; }
  if (!status) status = state.themaEditKind === 'ready' ? t('Bereit','Ready') : t('In Prüfung','Under review');
  if (id === 'new') {
    state.themen.push({ id: 't' + Date.now(), label, status, kind: state.themaEditKind });
  } else {
    const th = state.themen.find(x => x.id === id);
    if (th) { th.label = label; th.status = status; th.kind = state.themaEditKind; }
  }
  state.themaEditingId = null;
  persist();
  render();
}
function themaDelete(id){
  state.themen = state.themen.filter(x => x.id !== id);
  if (state.themaEditingId === id) state.themaEditingId = null;
  persist();
  render();
}

const DEMO_EMAIL = 'demo@coverd.ch';
const DEMO_PASSWORD = 'demo2026';
function tryLogin(){
  const e = (document.getElementById('loginEmail') || {}).value || '';
  const p = (document.getElementById('loginPassword') || {}).value || '';
  if (e.trim().toLowerCase() === DEMO_EMAIL && p === DEMO_PASSWORD) {
    state.loggedIn = true;
    state.loginError = false;
  } else {
    state.loginError = true;
  }
  render();
}
function onLoginKey(e){ if (e.key === 'Enter') tryLogin(); }
function logout(){
  state.loggedIn = false;
  state.loginError = false;
  state.screen = 'dash';
  render();
}
function loginView(){
  return `
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:#161BFD;">
    <div class="card" style="max-width:380px; width:100%; padding:34px;">
      <div style="width:132px; height:34px; position:relative; margin-bottom:28px;"><img src="images/coverd-logo.png" alt="coverd ag" style="position:absolute; left:0; top:0; width:132px; height:34px; object-fit:contain;"></div>
      <h1 style="margin:0; font-size:24px; font-weight:600; letter-spacing:-0.01em;">${t('Willkommen zurück','Welcome back')}</h1>
      <p style="margin:10px 0 24px; font-size:15px; color:#6E6E6B;">${t('Melden Sie sich an, um Ihr Kundenportal zu öffnen.','Sign in to open your client portal.')}</p>
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('E-Mail','Email')}</div><input id="loginEmail" class="input" type="email" placeholder="name@example.ch" onkeydown="onLoginKey(event)"></div>

function handlePolicyUpload(event){
  var file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!window.pdfjsLib) {
    state.messages.push({ role: 'bot', text: t('Dokumenten-Analyse ist gerade nicht verfügbar. Bitte später erneut versuchen.', 'Document analysis is not available right now. Please try again later.') });
    render();
    return;
  }
  state.uploadedDocName = file.name;
  state.uploadedDocText = null;
  state.uploadedDocStatus = 'loading';
  render();
  var reader = new FileReader();
  reader.onload = function(e){
    var typedarray = new Uint8Array(e.target.result);
    pdfjsLib.getDocument({ data: typedarray }).promise.then(function(pdf){
      var pagePromises = [];
      for (var i = 1; i <= pdf.numPages; i++){
        pagePromises.push(pdf.getPage(i).then(function(page){
          return page.getTextContent().then(function(tc){
            return tc.items.map(function(it){ return it.str; }).join(' ');
          });
        }));
      }
      return Promise.all(pagePromises);
    }).then(function(pagesText){
      state.uploadedDocText = pagesText.join('\n');
      state.uploadedDocStatus = 'ready';
      state.messages.push({ role: 'bot', text: t(
        'Dokument „' + file.name + '“ wurde eingelesen. Sie können jetzt Fragen dazu stellen, z. B. „Wie hoch ist die Prämie?“',
        'Document "' + file.name + '" has been read. You can now ask questions about it, e.g. "What is the premium?"'
      ) });
      render();
    }).catch(function(){
      state.uploadedDocStatus = 'error';
      state.messages.push({ role: 'bot', text: t(
        'Das Dokument konnte nicht gelesen werden. Bitte versuchen Sie es mit einer anderen PDF-Datei.',
        'The document could not be read. Please try a different PDF file.'
      ) });
      render();
    });
  };
  reader.readAsArrayBuffer(file);
}
function clearUploadedDoc(){
  state.uploadedDocName = null;
  state.uploadedDocText = null;
  state.uploadedDocStatus = null;
  render();
}

function parseChfAmount(s){
  if (!s) return 0;
  var m = String(s).replace(/'/g, '').match(/[\d.,]+/);
  if (!m) return 0;
  return parseFloat(m[0].replace(',', '.')) || 0;
}
function fmtChf(n){ return 'CHF ' + n.toFixed(2); }
function totalMonthlyPremium(){
  return state.policies.reduce(function(sum, p){ return sum + parseChfAmount(p.praemie); }, 0);
}
function nowStr(){
  var d = new Date();
  function pad(n){ return String(n).padStart(2, '0'); }
  return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function upcomingItems(){

    }; });
}
function detectProduktFromText(text){
  var s = text.toLowerCase();
  var map = [
    [/kranken|grundversicherung/, 'Krankenkasse', 'Health insurance'],
    [/fahrzeug|kasko|motorfahrzeug/, 'Autoversicherung', 'Car insurance'],
    [/hausrat/, 'Hausrat', 'Home contents insurance'],
    [/haftpflicht/, 'Privathaftpflicht', 'Personal liability insurance'],
    [/rechtsschutz/, 'Rechtsschutz', 'Legal protection insurance'],
    [/lebensversicherung|säule 3a|saule 3a/, 'Lebensversicherung', 'Life insurance'],
    [/reiseversicherung/, 'Reiseversicherung', 'Travel insurance'],
    [/gebäudeversicherung|gebaeudeversicherung/, 'Gebäudeversicherung', 'Building insurance']
  ];
  for (var i = 0; i < map.length; i++){
    if (map[i][0].test(s)) return { de: map[i][1], en: map[i][2] };
  }
  return { de: 'Versicherung', en: 'Insurance' };
}
function extractGesellschaft(text){
  var m = text.match(/([A-ZÄÖÜ][A-Za-zÄÖÜäöüß.\- ]{2,40}(Versicherung(en)?|Assurance)\s?AG)/);
  return m ? m[1].trim() : null;
}
function handleNewPolicyUpload(event){
  var file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!window.pdfjsLib) {
    alert(t('PDF-Analyse ist gerade nicht verfügbar. Bitte später erneut versuchen.', 'PDF analysis is not available right now. Please try again later.'));
    return;
  }
  var pendingKey = 'pending-' + Date.now();
  state.policyUploadBusy = true;
  state.policies.push({ key: pendingKey, pending: true, reading: true, produkt: t('Wird gelesen…','Reading…'), produktEn: t('Wird gelesen…','Reading…') });
  render();
  var reader = new FileReader();
  reader.onload = function(e){
    var typedarray = new Uint8Array(e.target.result);
    pdfjsLib.getDocument({ data: typedarray }).promise.then(function(pdf){
      var pagePromises = [];
      for (var i = 1; i <= pdf.numPages; i++){
        pagePromises.push(pdf.getPage(i).then(function(page){
          return page.getTextContent().then(function(tc){
            return tc.items.map(function(it){ return it.str; }).join(' ');
          });
        }));
      }

    }).then(function(pagesText){
      var text = pagesText.join('\n');
      var idxP = findLabelIndex(text, ['Jahresprämie', 'Monatsprämie', 'Prämienforderung', 'Prämienrechnung', 'Prämie']);
      var praemie = extractAmountNear(text, idxP, 250, true);
      var idxS = findLabelIndex(text, ['Selbstbehalt', 'Franchise']);

      var idxD = findLabelIndex(text, ['Beginn', 'Vertragsdauer', 'Prämienforderung', 'Von']);
      var dates = extractDatesNear(text, idxD, 250);
      var prod = detectProduktFromText(text);
      var ges = extractGesellschaft(text);
      var idx = state.policies.findIndex(function(p){ return p.key === pendingKey; });
      if (idx !== -1) {
        state.policies[idx] = {
          key: pendingKey,
          pending: true,
          reading: false,
          produkt: prod.de, produktEn: prod.en,
          gesellschaft: ges || t('Wird geprüft','Being reviewed'), gesellschaftEn: ges || t('Wird geprüft','Being reviewed'),
          praemie: praemie || t('Wird ermittelt','To be determined'), praemieEn: praemie || t('Wird ermittelt','To be determined'),
          selbst: selbst || '—', selbstEn: selbst || '—',
          ablauf: dates ? dates.bis : '—',
          deckung: t('Diese Police wurde hochgeladen und wird von Ihrem Berater geprüft und erfasst.','This policy was uploaded and is being reviewed and recorded by your advisor.'),
          deckungEn: 'This policy was uploaded and is being reviewed and recorded by your advisor.',

        };

      state.policyUploadBusy = false;

function findLabelIndex(text, labels){
  var lower = text.toLowerCase();
  for (var i = 0; i < labels.length; i++){
    var idx = lower.indexOf(labels[i].toLowerCase());
    if (idx !== -1) return idx;
  }
  return -1;
}
function extractAmountNear(text, idx, window, allowBareNumber){
  if (idx === -1) return null;
  var slice = text.substr(idx, window || 250);
  var re = /CHF\s*[\d'.,]+(?:\s*(Mio\.?|Million(?:en)?))?/g;
  var m;
  while ((m = re.exec(slice))) {
    if (m[1]) continue;
    return m[0].replace(/\s+/g, ' ').trim();
  }
  if (allowBareNumber) {
    var m2 = slice.match(/\b\d{1,3}(?:'?\d{3})*\.\d{2}\b/);
    if (m2) return 'CHF ' + m2[0];
  }
  return null;
}
function extractDatesNear(text, idx, window){
  if (idx === -1) return null;
  var slice = text.substr(idx, window || 250);
  var m = slice.match(/(\d{2}\.\d{2}\.\d{4})\D{0,40}?(\d{2}\.\d{2}\.\d{4})/);
  return m ? { von: m[1], bis: m[2] } : null;
}
function searchUploadedDoc(q){
  var text = state.uploadedDocText;
  if (!text) return null;
  var s = q.toLowerCase();
  var noteDe = ' (Automatisch erkannt aus „' + state.uploadedDocName + '“ — nicht von einem Berater geprüft.)';
  var noteEn = ' (Automatically detected from "' + state.uploadedDocName + '" — not verified by an advisor.)';

  if (/(prämie|praemie|kosten|zahle|preis|premium|cost|price)/.test(s)) {
    var idx = findLabelIndex(text, ['Jahresprämie', 'Prämienforderung', 'Monatsprämie', 'Prämienrechnung', 'Prämie']);
    var amt = extractAmountNear(text, idx, 250, true);
    if (amt) return t('Laut Ihrem hochgeladenen Dokument beträgt die Prämie ' + amt + '.' + noteDe, 'According to your uploaded document, the premium is ' + amt + '.' + noteEn);
  }
  if (/(selbstbehalt|franchise|deductible)/.test(s)) {
    var idxSb = findLabelIndex(text, ['Selbstbehalt', 'Franchise']);
    var amtSb = extractAmountNear(text, idxSb, 250, false);
    if (amtSb) return t('Laut Ihrem hochgeladenen Dokument beträgt der Selbstbehalt ' + amtSb + '.' + noteDe, 'According to your uploaded document, the deductible is ' + amtSb + '.' + noteEn);
  }
  if (/(laufzeit|läuft|gültig|gueltig|ablauf|zeitraum|period|valid|expir|von bis)/.test(s)) {
    var idxD = findLabelIndex(text, ['Beginn', 'Vertragsdauer', 'Prämienforderung', 'Von']);
    var dates = extractDatesNear(text, idxD, 250);
    if (dates) return t('Laut Ihrem hochgeladenen Dokument läuft der Vertrag vom ' + dates.von + ' bis ' + dates.bis + '.' + noteDe, 'According to your uploaded document, the contract runs from ' + dates.von + ' to ' + dates.bis + '.' + noteEn);
  }
  if (/(gesellschaft|anbieter|versicherer|insurer|provider|wer versichert)/.test(s)) {
    var m = text.match(/([A-ZÄÖÜ][A-Za-zÄÖÜäöüß.\- ]{2,40}(Versicherung(en)?|Assurance)\s?AG)/);
    if (m) return t('Laut Ihrem hochgeladenen Dokument ist der Versicherer: ' + m[1].trim() + '.' + noteDe, 'According to your uploaded document, the insurer is: ' + m[1].trim() + '.' + noteEn);
  }
  if (/(fahrzeug|auto|bmw|car|vehicle)/.test(s)) {
    var idxF = findLabelIndex(text, ['Fahrzeugversicherung', 'Fahrzeug']);
    if (idxF !== -1) {
      var slice = text.substr(idxF, 160).replace(/\s+/g, ' ').trim();
      return t('Zu Ihrem Fahrzeug fand ich im hochgeladenen Dokument: „' + slice + '“.' + noteDe, 'Regarding your vehicle, I found this in your uploaded document: "' + slice + '".' + noteEn);
    }
  }
  return null;
}

function answer(q){
  const docAnswer = searchUploadedDoc(q);
  if (docAnswer) return docAnswer;
  const s = q.toLowerCase();
  const prod = (p) => t(p.produkt, p.produktEn);
  const praemieTxt = (p) => t(p.praemie, p.praemieEn);
  const noPolicies = t('Sie haben noch keine Policen hochgeladen. Laden Sie Ihre erste Police unter „Meine Versicherungen“ hoch, damit ich dazu Fragen beantworten kann.', 'You haven\'t uploaded any policies yet. Upload your first policy under "My Insurance" so I can answer questions about it.');
  const hit = state.policies.find((p) => !p.reading && (p.tags || []).some((tag) => s.includes(tag)));
  if (/(prämie|praemie|zahle|kosten|monat|preis|total|premium|cost|price|month)/.test(s)) {
    if (hit) return prod(hit) + ': ' + praemieTxt(hit) + ' (' + t(hit.gesellschaft, hit.gesellschaftEn) + ').';
    if (state.policies.length === 0) return noPolicies;
    return t('Ihre Versicherungen kosten zusammen ' + fmtChf(totalMonthlyPremium()) + ' pro Monat.', 'Your insurance policies cost a total of ' + fmtChf(totalMonthlyPremium()) + ' per month.');
  }
  if (/(selbstbehalt|franchise|deductible)/.test(s)) {
    if (state.policies.length === 0) return noPolicies;
    const lines = state.policies.filter(p => !p.reading).map(p => prod(p) + ' — ' + t(p.selbst, p.selbstEn));
    return lines.length ? t('Ihre Selbstbehalte:\n\n','Your deductibles:\n\n') + lines.join('\n') : noPolicies;
  }
  if (/(velo|fahrrad|gestohlen|diebstahl|einbruch|bike|bicycle|stolen|theft|burglary)/.test(s)) {
    const hausrat = state.policies.find(p => !p.reading && /hausrat|home contents/i.test(p.produkt + ' ' + (p.produktEn||'')));
    if (hausrat) return t('Ja. Ihre ' + hausrat.produkt + ' deckt Diebstahl auch auswärts, Selbstbehalt ' + t(hausrat.selbst, hausrat.selbstEn) + '.', 'Yes. Your ' + hausrat.produktEn + ' covers theft away from home too, deductible ' + t(hausrat.selbst, hausrat.selbstEn) + '.');
    return t('Dazu finde ich keine passende Police. Laden Sie Ihre Hausratversicherung hoch, damit ich das prüfen kann.', "I can't find a matching policy for that. Upload your home contents insurance so I can check.");
  }
  if (/(umzug|adresse|neue wohnung|move|moving|address)/.test(s)) {
    return t('Eine neue Adresse melden Sie am besten direkt bei Jan Krapl — er passt die betroffenen Policen für Sie an.', 'You can report a new address directly to Jan Krapl — he will update the affected policies for you.');
  }
  if (/(schaden|anliegen|melden|unfall|bearbeitung|claim|report|accident|progress)/.test(s)) {
    const offen = state.claims.find(c => /bearbeitung|progress/i.test(c.status + ' ' + (c.statusEn||'')));
    if (offen) return t('Ein Anliegen ist in Bearbeitung: ' + offen.titel + '.', 'One request is in progress: ' + (offen.titelEn || offen.titel) + '.');
    return t('Aktuell ist kein Anliegen in Bearbeitung.', 'There is currently no request in progress.');
  }
  if (/(nachricht|ungelesen|message|unread)/.test(s)) {
    if (state.verlauf.length === 0) return t('Im Verlauf auf dem Dashboard sind noch keine Nachrichten vorhanden.', "There aren't any messages in the dashboard history yet.");
    const last = state.verlauf[state.verlauf.length - 1];
    return t('Die jüngste Nachricht im Verlauf ist von ' + last.name + ' vom ' + last.zeit + '.', 'The most recent message in the history is from ' + last.name + ' on ' + last.zeit + '.');
  }
  if (/(rechnung|fällig|faellig|zahlung|invoice|due|payment)/.test(s)) {
    return t('Aktuell ist bei uns keine offene Rechnung hinterlegt.', 'There is currently no outstanding invoice on file.');
  }
  if (/(kündig|wechsel|frist|cancel|switch|notice)/.test(s)) {
    return t('Kündigungsfristen hängen von der jeweiligen Police ab. Öffnen Sie die gewünschte Police unter „Meine Versicherungen“ oder fragen Sie direkt bei Jan Krapl nach.', 'Notice periods depend on the specific policy. Open the policy under "My Insurance" or ask Jan Krapl directly.');
  }
  if (hit) return prod(hit) + ' (' + t(hit.gesellschaft, hit.gesellschaftEn) + '), ' + praemieTxt(hit) + '.\n\n' + t(hit.deckung, hit.deckungEn);
  if (/(versichert|deckung|gedeckt|abgedeckt|insured|coverage|covered)/.test(s)) {
    if (state.policies.length === 0) return noPolicies;
    const list = state.policies.filter(p => !p.reading).map(prod).join(', ');
    return list ? t('Gedeckt sind: ' + list + '.', 'Covered: ' + list + '.') : noPolicies;
  }
  return t('Dazu finde ich in Ihren Policen keine Angabe. Jan Krapl hilft weiter: 078 248 91 21 oder jkrapl@coverd.ch.', "I can't find that in your policies. Jan Krapl can help further: 078 248 91 21 or jkrapl@coverd.ch.");
}

function send(text){
  const q = (text || '').trim();
  if (!q) return;
  state.messages.push({ role: 'user', text: q });
  const a = answer(q);
  state.messages.push({ role: 'bot', text: a });
  speak(a);
  render();
}

  el.value = '';

var recognition = null;
function initRecognition(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) return null;
  const r = new Ctor();
  r.lang = 'de-CH';
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = function(e){ send(e.results[0][0].transcript); };
  r.onend = function(){ state.listening = false; render(); };
  r.onerror = function(){ state.listening = false; render(); };
  return r;
}
function toggleMic(){
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;
  if (state.listening) {
    recognition.stop();
    state.listening = false;
  } else {
    state.listening = true;
    recognition.start();
  }
  render();
}
function toggleVoiceOut(){
  state.voiceOut = !state.voiceOut;
  if (!state.voiceOut && window.speechSynthesis) window.speechSynthesis.cancel();
  render();
}
function speak(text){
  if (!state.voiceOut || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-CH';
  window.speechSynthesis.speak(u);
}

function ring(pct, color, center, size){
  size = size || 132;
  const inner = Math.round(size * 0.727);
  return `<div style="width:${size}px; height:${size}px; border-radius:999px; background:conic-gradient(${color} 0 ${pct}%, #E7E6F8 ${pct}% 100%); display:grid; place-items:center; flex:none;">
    <div style="width:${inner}px; height:${inner}px; border-radius:999px; background:#FFFFFF; display:grid; place-items:center; font-size:30px; font-weight:600;">${center}</div>
  </div>`;
}

          <img src="team/jan.jpg" alt="Jan Krapl" style="width:36px; height:36px; border-radius:999px; object-fit:cover; object-position:50% 22%; flex:none;">
          <div><div class="micro">${t('Ihr Berater','Your advisor')}</div><div style="font-size:15px; font-weight:600; margin-top:3px;">Jan Krapl</div></div>
        </div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card"><h2 style="margin:0 0 14px; font-size:17px; font-weight:600;">${t('Was passiert ist','What happened')}</h2><p style="margin:0; font-size:15px; line-height:1.6;">${t(c.beschrieb, c.beschriebEn)}</p></div>
      <div class="card">
        <h2 style="margin:0 0 18px; font-size:17px; font-weight:600;">${t('Stand der Bearbeitung','Processing status')}</h2>
        ${c.schritte.map(([titel,titelEn,datum]) => `
        <div style="display:flex; gap:14px; align-items:flex-start; padding-bottom:16px;">
          <div style="width:10px; height:10px; border-radius:999px; background:${datum==='offen'?'#D4D1EC':'#3D2BFF'}; margin-top:6px; flex:none;"></div>
          <div><div style="font-size:15px; font-weight:600;">${t(titel,titelEn)}</div><div style="font-size:14px; color:#6E6E6B; margin-top:3px;">${datum==='offen' ? t('offen','open') : datum}</div></div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function newsView(){
  const NEWS = [
    { kategorie: 'Tipp', kategorieEn: 'Tip', neu: true, titel: 'Hausrat nach grösseren Anschaffungen prüfen', titelEn: 'Review home contents after major purchases', text: 'Neue Möbel, ein Instrument oder ein E-Bike heben den Wert des Haushalts schnell an. Liegt die Summe zu tief, kürzt die Versicherung im Schadenfall anteilig.', textEn: 'New furniture, an instrument or an e-bike can quickly raise the value of your household contents. If the sum insured is too low, the insurer will reduce payouts proportionally in the event of a claim.', meta: '01.09.2026 · Jan Krapl' },
    { kategorie: 'Hinweis', kategorieEn: 'Notice', neu: true, titel: 'Krankenkasse: Prämien 2027 sind da', titelEn: 'Health insurance: 2027 premiums are here', text: 'Die neuen Prämien liegen vor. Wer wechseln will, muss die Kündigung bis 30. November einreichen. Wir rechnen Ihnen die Varianten gerne durch.', textEn: "The new premiums are available. Anyone wishing to switch must submit their cancellation by November 30. We're happy to calculate the options for you.", meta: '20.08.2026 · coverd ag' },
    { kategorie: 'Recht', kategorieEn: 'Legal', neu: false, titel: 'Velo und E-Bike richtig versichern', titelEn: 'Insuring your bike and e-bike correctly', text: 'Seit dem Wegfall der Velovignette läuft die Haftpflicht über die Privathaftpflicht. Diebstahl auswärts ist nur mit entsprechender Hausratdeckung eingeschlossen.', textEn: 'Since the bicycle vignette was abolished, liability is covered through personal liability insurance. Theft away from home is only included with the appropriate home contents coverage.', meta: '12.05.2026 · coverd ag' },
    { kategorie: 'Intern', kategorieEn: 'Internal', neu: false, titel: 'Neues Kundenportal ab Oktober', titelEn: 'New customer portal from October', text: 'Änderungen, Schadenmeldungen und Dokumente laufen künftig über das Portal. Ihre bisherigen Unterlagen sind bereits übernommen.', textEn: 'Changes, claim reports and documents will now go through the portal. Your existing documents have already been transferred.', meta: '12.06.2026 · coverd ag' }
  ];
  return `
  <div style="display:flex; flex-direction:column; gap:22px;">
    <p style="margin:0; font-size:16px; color:#6E6E6B;">${t('Hinweise und Tipps von coverd ag','Notices and tips from coverd ag')}</p>
    <div class="grid-news">
      ${NEWS.map(n => `
      <article class="card" style="display:flex; flex-direction:column; gap:12px;">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;"><span class="micro">${t(n.kategorie,n.kategorieEn)}</span>${n.neu ? `<span style="font-size:12px; font-weight:600; color:#3D2BFF; background:#F5F4FF; border-radius:999px; padding:4px 10px;">${t('neu','new')}</span>` : ''}</div>
        <h2 style="margin:0; font-size:19px; font-weight:600; line-height:1.3;">${t(n.titel,n.titelEn)}</h2>
        <p style="margin:0; font-size:15px; line-height:1.6; color:#4A4A48;">${t(n.text,n.textEn)}</p>
        <div style="font-size:14px; color:#6E6E6B; margin-top:auto; padding-top:8px;">${n.meta}</div>
      </article>`).join('')}
    </div>
  </div>`;
}

function hilfeView(){
  const FAQ = [
    ['Wie melde ich einen Schaden?','How do I report a claim?'],
    ['Wo finde ich meine Police als PDF?','Where can I find my policy as a PDF?'],
    ['Was mache ich bei einem Umzug?','What do I do when I move?'],
    ['Wie ändere ich meine Franchise?','How do I change my deductible?'],
    ['Wie lange dauert eine Auszahlung?','How long does a payout take?'],
    ['Wie ändere ich meine E-Mailadresse?','How do I change my email address?']
  ];
  return `
  <div style="display:flex; flex-direction:column; gap:26px;">
    <div class="card" style="padding:36px;">
      <h1 style="margin:0; font-size:28px; font-weight:600; letter-spacing:-0.01em;">${t('Wie können wir helfen?','How can we help?')}</h1>
      <div style="display:flex; align-items:center; gap:12px; background:#F3F3F1; border:1px solid #E4E4E1; border-radius:999px; padding:14px 20px; margin-top:20px; max-width:560px;">
        <div style="width:8px; height:8px; border-radius:999px; background:#3D2BFF; flex:none;"></div>
        <input class="input" style="border:0; background:transparent; padding:0;" placeholder="${t('Hilfeseite durchsuchen','Search the help page')}">
      </div>
    </div>
    <div class="card" style="padding:30px;">
      <h2 style="margin:0 0 20px; font-size:19px; font-weight:600;">${t('Häufige Fragen','Frequently asked questions')}</h2>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px 32px;">
        ${FAQ.map(([fDe,fEn]) => `<a href="#" onclick="return false;" style="font-size:16px; font-weight:600; line-height:1.4; display:flex; gap:10px; align-items:baseline;"><span style="color:#3D2BFF;">→</span>${t(fDe,fEn)}</a>`).join('')}
      </div>
    </div>
    <div class="grid-2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));">
      <div class="card" style="display:flex; flex-direction:column; gap:12px;"><div style="font-size:17px; font-weight:600;">${t('Allgemein','General')}</div><p style="margin:0; font-size:15px; color:#6E6E6B; line-height:1.5;">${t('Hilfe und Tipps zur Nutzung des Portals.','Help and tips for using the portal.')}</p><button class="pill-outline" style="align-self:flex-start; margin-top:6px;">${t('Anzeigen','View')}</button></div>
      <div class="card" style="display:flex; flex-direction:column; gap:12px;"><div style="font-size:17px; font-weight:600;">${t('Sicherheit','Security')}</div><p style="margin:0; font-size:15px; color:#6E6E6B; line-height:1.5;">${t('Einstellungen, mit denen Sie Ihr Konto schützen.','Settings to help protect your account.')}</p><button class="pill-outline" style="align-self:flex-start; margin-top:6px;">${t('Anzeigen','View')}</button></div>
      <div class="help-dark"><div style="font-size:17px; font-weight:600;">${t('Lieber persönlich?','Prefer to talk in person?')}</div><p style="margin:0; font-size:15px; color:#B9B9B4; line-height:1.5;">Jan Krapl, 078 248 91 21, jkrapl@coverd.ch</p><button class="btn-white" onclick="alert(t('Rückruf angefordert (Demo).','Callback requested (demo).'))">${t('Rückruf anfordern','Request a callback')}</button></div>
    </div>
  </div>`;
}

function profilView(){
  const pt = state.profilTab;
  const tabs = [['allg', t('Allgemeine Informationen','General information')],['sicher', t('Sicherheit','Security')],['benach', t('Benachrichtigungen','Notifications')]];
  const titleMap = { allg: t('Persönliche Informationen','Personal information'), sicher: t('Sicherheit','Security'), benach: t('Benachrichtigungen','Notifications') };
  const subMap = { allg: t('Verwalten Sie Ihre persönlichen Angaben','Manage your personal details'), sicher: t('Einstellungen, mit denen Sie Ihr Konto schützen','Settings to help protect your account'), benach: t('Bestimmen Sie, worüber wir Sie informieren','Choose what we notify you about') };
  const notifyDefs = [['schaden', t('Anliegen und Schäden','Requests and claims'), t('Statusänderungen und Auszahlungen','Status changes and payouts')], ['policen', t('Versicherungen','Insurance'), t('Änderungen und Verlängerungen','Changes and renewals')], ['news', t('News','News'), t('Tipps und Hinweise','Tips and notices')]];
  return `
  <div style="display:flex; flex-wrap:wrap; gap:26px; align-items:flex-start;">
    <aside class="card" style="flex:1 1 280px; max-width:320px; padding:0; overflow:hidden;">
      <div style="padding:26px; display:flex; flex-direction:column; gap:14px; border-bottom:1px solid #E4E4E1;">
        <div style="width:64px; height:64px; border-radius:999px; background:#F5F4FF; color:#3D2BFF; display:grid; place-items:center; font-size:22px; font-weight:700;">AM</div>
        <div><div style="font-size:18px; font-weight:600;">Alex Muster</div><div style="font-size:14px; color:#6E6E6B; margin-top:3px;">${t('Privatkundin seit 2019','Private customer since 2019')}</div></div>
        <span class="badge badge-ok" style="align-self:flex-start;">${t('Aktiv','Active')}</span>
      </div>
      <div style="padding:12px;">
        ${tabs.map(([k,l]) => `<button class="profil-tab ${pt===k?'active':''}" onclick="setProfilTab('${k}')">${l}</button>`).join('')}
      </div>
    </aside>
    <div class="card" style="flex:3 1 420px; min-width:0; padding:30px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;">
        <div><h2 style="margin:0; font-size:19px; font-weight:600;">${titleMap[pt]}</h2><p style="margin:8px 0 0; font-size:15px; color:#6E6E6B;">${subMap[pt]}</p></div>
        <button class="btn-blue-sm" onclick="alert(t('Gespeichert (Demo).','Saved (demo).'))">${t('Speichern','Save')}</button>
      </div>
      ${pt === 'allg' ? `
      <div class="grid-fields" style="margin-top:26px;">
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Vorname','First name')}</div><input class="input" value="Alex"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Nachname','Last name')}</div><input class="input" value="Muster"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Adresse','Address')}</div><input class="input" value="Musterstrasse 1"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('PLZ und Ort','Postal code and city')}</div><input class="input" value="4600 Olten"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Telefon','Phone')}</div><input class="input" value="079 000 00 00"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('E-Mail','Email')}</div><input class="input" value="alex.muster@example.ch"></div>
      </div>` : ''}
      ${pt === 'sicher' ? `
      <div style="display:flex; flex-direction:column; gap:22px; margin-top:26px;">
        <div class="grid-fields">
          <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('E-Mail für die Anmeldung','Login email')}</div><input class="input" value="alex.muster@example.ch"></div>
          <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">${t('Handynummer für die Zwei-Faktor-Anmeldung','Phone number for two-factor login')}</div><input class="input" value="079 000 00 00"></div>
        </div>
        <div style="border-top:1px solid #F0F0EE; padding-top:22px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div><div style="font-size:16px; font-weight:600;">${t('Kennwort','Password')}</div><div style="font-size:14px; color:#6E6E6B; margin-top:4px;">${t('Zuletzt geändert am 11.03.2026','Last changed on 11.03.2026')}</div></div>
          <button class="pill-outline">${t('Jetzt ändern','Change now')}</button>
        </div>
      </div>` : ''}
      ${pt === 'benach' ? `
      <div style="display:flex; flex-direction:column; margin-top:26px;">
        ${notifyDefs.map(([key,titel,sub]) => { const on = state.notify[key]; return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 0; border-bottom:1px solid #F0F0EE;">
          <div><div style="font-size:16px; font-weight:600;">${titel}</div><div style="font-size:14px; color:#6E6E6B; margin-top:4px;">${sub}</div></div>
          <button class="toggle" style="background:${on?'#3D2BFF':'#DDDDD9'}; justify-content:${on?'flex-end':'flex-start'};" onclick="toggleNotify('${key}')"><span></span></button>
        </div>`; }).join('')}
      </div>` : ''}
    </div>
  </div>`;
}

function mainBody(){
  const policy = state.policy && state.policies.find(p => p.key === state.policy);
  const claim = state.claim && state.claims.find(c => c.key === state.claim);
  if (state.screen === 'dash') return dashboardView();
  if (state.screen === 'policen') return policy ? policeDetailView() : policenListView();
  if (state.screen === 'schaden') return claim ? schadenDetailView() : schadenListView();
  if (state.screen === 'news') return newsView();
  if (state.screen === 'hilfe') return hilfeView();
  if (state.screen === 'profil') return profilView();
  return dashboardView();
}

function chatWidget(){
  const greeting = { role: 'bot', text: t('Guten Tag. Ich beantworte Fragen zu Ihren Versicherungen — Prämien, Deckungen, Selbstbehalte. Für alles Weitere ist Jan Krapl da.', 'Good afternoon. I can answer questions about your insurance policies — premiums, coverage, deductibles. For everything else, Jan Krapl is here to help.') };
  const msgs = [greeting, ...state.messages];
  return `
  <div class="chatbot">
    ${state.botOpen ? `
    <div class="chat-panel">
      <div class="chat-head">
        <div style="width:10px; height:10px; border-radius:999px; background:#3D2BFF; flex:none;"></div>
        <div style="min-width:0; flex:1 1 auto;"><div style="font-size:15px; font-weight:600;">${t('coverd Assistent','coverd Assistant')}</div><div style="font-size:13px; color:#6E6E6B;">${t('Antwortet aus Ihren Policen','Answers using your policies')}</div></div>
        <button onclick="toggleVoiceOut()" title="${state.voiceOut ? t('Antworten nicht mehr vorlesen','Stop reading answers aloud') : t('Antworten vorlesen','Read answers aloud')}" style="border:0; background:transparent; font-size:18px; color:#6E6E6B; cursor:pointer; line-height:1; padding:4px 6px; opacity:${state.voiceOut ? 1 : 0.4};">${state.voiceOut ? '🔊' : '🔈'}</button>
        <button onclick="closeBot()" style="border:0; background:transparent; font-size:20px; color:#6E6E6B; cursor:pointer; line-height:1; padding:4px 6px;">×</button>
      </div>
      ${state.uploadedDocName ? `
      <div style="padding:10px 22px; background:#F3F3F1; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; color:#6E6E6B; border-bottom:1px solid #E4E4E1;">
        <span>📄 ${esc(state.uploadedDocName)}${state.uploadedDocStatus === 'loading' ? ' — ' + t('wird gelesen…', 'reading…') : state.uploadedDocStatus === 'error' ? ' — ' + t('Fehler','error') : ''}</span>
        <button onclick="clearUploadedDoc()" title="${t('Dokument entfernen','Remove document')}" style="border:0; background:transparent; cursor:pointer; color:#6E6E6B; font-size:14px; flex:none;">✕</button>
      </div>` : ''}
      <div class="chat-messages" id="botScroll">
        ${msgs.map(m => `<div style="display:flex; justify-content:${m.role==='user'?'flex-end':'flex-start'};"><div class="chat-bubble" style="background:${m.role==='user'?'#0A0A0B':'#F3F3F1'}; color:${m.role==='user'?'#FFFFFF':'#0A0A0B'};">${esc(m.text)}</div></div>`).join('')}
      </div>
      <div class="chat-foot">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="chip-suggest" onclick="send('${t('Ist mein Velo versichert?','Is my bike insured?')}')">${t('Ist mein Velo versichert?','Is my bike insured?')}</button>
          <button class="chip-suggest" onclick="send('${t('Wie hoch ist mein Selbstbehalt?','What is my deductible?')}')">${t('Wie hoch ist mein Selbstbehalt?','What is my deductible?')}</button>
        </div>
        <div style="display:flex; gap:10px;">
          <input id="botInput" class="input" placeholder="${state.listening ? t('Ich höre zu …','Listening…') : t('Frage zu Ihren Versicherungen stellen','Ask a question about your insurance')}" onkeydown="onBotKey(event)">
          <input type="file" id="policyUploadInput" accept="application/pdf" style="display:none;" onchange="handlePolicyUpload(event)">
          <button class="btn-mic" onclick="document.getElementById('policyUploadInput').click()" title="${t('Policendokument hochladen (PDF)','Upload policy document (PDF)')}">📎</button>
          ${(window.SpeechRecognition || window.webkitSpeechRecognition) ? `<button class="btn-mic ${state.listening ? 'listening' : ''}" onclick="toggleMic()" title="${state.listening ? t('Aufnahme stoppen','Stop recording') : t('Frage per Sprache stellen','Ask a question by voice')}">${state.listening ? '⏹️' : '🎤'}</button>` : ''}
          <button class="btn-blue-sm" onclick="sendFromInput()">${t('Senden','Send')}</button>
        </div>
      </div>
    </div>` : ''}
    <button class="fab" onclick="toggleBot()">${t('Fragen? Assistent öffnen','Questions? Open assistant')}</button>
  </div>`;
}

function render(){
  document.title = t('Kundenportal – coverd ag','Customer Portal – coverd ag');
  if (!state.loggedIn) {
    document.getElementById('app').innerHTML = loginView();
    return;
  }
  document.getElementById('app').innerHTML = `<div class="app-flex">${sidebar()}<div class="main-col">${topheader()}<main class="main-content">${mainBody()}</main></div></div>${chatWidget()}`;
  const sc = document.getElementById('botScroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
}

loadPersisted();
render();
</script>
</body>
</html>
