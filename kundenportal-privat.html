  main.main-content{ padding:36px; max-width:1280px; width:100%; }

  .card{ border:1px solid #E4E4E1; background:#FFFFFF; border-radius:22px; padding:26px; }
  .list-card{ border:1px solid #E4E4E1; background:#FFFFFF; border-radius:20px; padding:24px; cursor:pointer; font:inherit; text-align:left; width:100%; }
  .list-card:hover{ border-color:#0A0A0B; }

    .sidebar-label{ display:none; }
    .sidebar-nav{ flex-direction:row; padding:0; }
    .nav-item{ white-space:nowrap; }
    .sidebar-advisor{ display:none; }
    main.main-content{ padding:20px; }
    .topheader{ padding:14px 20px; }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function go(screen){ state.screen = screen; state.policy = null; state.claim = null; render(); window.scrollTo(0,0); }

function answer(q){
  const s = q.toLowerCase();
  if (/(prämie|praemie|kosten|preis|zahle|total)/.test(s)) {
    const hit = POLICIES.find((p) => p.tags.some((t) => s.includes(t)));
    if (hit) return 'Die Prämie für ' + hit.produkt + ' beträgt ' + hit.praemie + ' (' + hit.gesellschaft + ', Police ' + hit.nr + ').';
    return 'Ihre sechs Policen kosten zusammen rund CHF 6\'350.00 pro Jahr. Grösster Posten: die Krankenkasse.';
  }
  if (/(läuft|lauft|ablauf|abläuft|kündig|erneuer|frist|verlänger)/.test(s)) {
    return 'Als Erstes läuft die Hausrat- und Privathaftpflichtversicherung am 28.02.2027 aus. Bei der Krankenkasse endet die Wechselfrist für die Franchise am 30. November.';
  }
  if (/(schaden|anliegen|unfall|bearbeitung)/.test(s)) {
    return 'Ein Fall ist in Bearbeitung: Wasserschaden Waschmaschine (Hausratversicherung, Mobiliar) — die Auszahlung wird geprüft.';
  }
  if (/(franchise|kasse|kk)/.test(s)) {
    return 'Ihre Franchise bei der CSS beträgt aktuell CHF 300. Ein Wechsel ist bis 30. November für das Folgejahr möglich.';
  }
  if (/(rechnung|fällig|faellig|zahlung)/.test(s)) {
    return 'Aktuell ist keine Rechnung offen. Die nächste Krankenkassenprämie wird am 1. des Monats abgebucht.';
  }
  const hit = POLICIES.find((p) => p.tags.some((t) => s.includes(t)) || s.includes(p.nr.toLowerCase()));
  if (hit) return hit.produkt + ' bei ' + hit.gesellschaft + ' (Police ' + hit.nr + '), ' + hit.praemie + ', läuft bis ' + hit.ablauf + '.\n\n' + hit.deckung;
  if (/(versichert|deckung|gedeckt|abgedeckt)/.test(s)) {
    return 'Gedeckt sind Krankenkasse, Auto, Hausrat, Privathaftpflicht, Risikoleben und Rechtsschutz. Bei Fragen zu einer bestimmten Police fragen Sie am besten direkt danach.';
  }
  return 'Dazu finde ich in Ihren Policen keine Angabe. Jan Krapl hilft weiter: 078 248 91 21 oder jkrapl@coverd.ch.';
}

function send(text){
  const q = (text || '').trim();
  if (!q) return;
  state.messages.push({ role: 'user', text: q });
  state.messages.push({ role: 'bot', text: answer(q) });
  render();
}
function sendFromInput(){
  const el = document.getElementById('botInput');
  send(el.value);
  el.value = '';
  el.focus();
}
function onBotKey(e){ if (e.key === 'Enter') sendFromInput(); }

  return `
  <div style="display:flex; flex-direction:column; gap:22px;">
    <p style="margin:0; font-size:16px; color:#6E6E6B;">Alles zu Ihren Verträgen an einem Ort</p>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      ${filters.map(f => `<button class="filter-pill ${state.docFilter===f?'active':''}" onclick="setDocFilter('${f}')">${f}</button>`).join('')}
    </div>
    <div class="grid-docs">
      ${filtered.map(d => `<div class="doc-card"><div class="micro" style="color:${d.farbe};">${d.typ}</div><div style="font-size:16px; font-weight:600; line-height:1.35;">${d.name}</div><div style="font-size:14px; color:#6E6E6B; margin-top:auto;">${d.meta}</div></div>`).join('')}
      ${filtered.length === 0 ? '<p style="color:#6E6E6B;">Keine Dokumente in dieser Kategorie.</p>' : ''}
    </div>
  </div>`;
}

function newsView(){
  return `
  <div style="display:flex; flex-direction:column; gap:22px;">
    <p style="margin:0; font-size:16px; color:#6E6E6B;">Fachbeiträge und Hinweise von coverd ag</p>
    <div class="grid-news">
      ${NEWS.map(n => `
      <article class="card" style="display:flex; flex-direction:column; gap:12px;">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;"><span class="micro">${n.kategorie}</span>${n.neu ? '<span style="font-size:12px; font-weight:600; color:#1F4FFF; background:#E8ECFF; border-radius:999px; padding:4px 10px;">neu</span>' : ''}</div>
        <h2 style="margin:0; font-size:19px; font-weight:600; line-height:1.3;">${n.titel}</h2>
        <p style="margin:0; font-size:15px; line-height:1.6; color:#4A4A48;">${n.text}</p>
        <div style="font-size:14px; color:#6E6E6B; margin-top:auto; padding-top:8px;">${n.meta}</div>
      </article>`).join('')}
    </div>
  </div>`;
}

function hilfeView(){
  return `
  <div style="display:flex; flex-direction:column; gap:26px;">
    <div class="card" style="padding:36px;">
      <h1 style="margin:0; font-size:28px; font-weight:600; letter-spacing:-0.01em;">Wie können wir helfen?</h1>
      <div style="display:flex; align-items:center; gap:12px; background:#F3F3F1; border:1px solid #E4E4E1; border-radius:999px; padding:14px 20px; margin-top:20px; max-width:560px;">
        <div style="width:8px; height:8px; border-radius:999px; background:#1F4FFF; flex:none;"></div>
        <input class="input" style="border:0; background:transparent; padding:0;" placeholder="Hilfeseite durchsuchen">
      </div>
    </div>
    <div class="card" style="padding:30px;">
      <h2 style="margin:0 0 20px; font-size:19px; font-weight:600;">Häufige Fragen</h2>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px 32px;">
        ${FAQ.map(f => `<a href="#" onclick="return false;" style="font-size:16px; font-weight:600; line-height:1.4; display:flex; gap:10px; align-items:baseline;"><span style="color:#1F4FFF;">→</span>${f}</a>`).join('')}
      </div>
    </div>
    <div class="grid-2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));">
      <div class="card" style="display:flex; flex-direction:column; gap:12px;"><div style="font-size:17px; font-weight:600;">Allgemein</div><p style="margin:0; font-size:15px; color:#6E6E6B; line-height:1.5;">Hilfe und Tipps zur Nutzung des Portals.</p><button class="pill-outline" style="align-self:flex-start; margin-top:6px;">Anzeigen</button></div>
      <div class="card" style="display:flex; flex-direction:column; gap:12px;"><div style="font-size:17px; font-weight:600;">Sicherheit</div><p style="margin:0; font-size:15px; color:#6E6E6B; line-height:1.5;">Einstellungen, mit denen Sie Ihr Konto schützen.</p><button class="pill-outline" style="align-self:flex-start; margin-top:6px;">Anzeigen</button></div>
      <div class="help-dark"><div style="font-size:17px; font-weight:600;">Lieber persönlich?</div><p style="margin:0; font-size:15px; color:#B9B9B4; line-height:1.5;">Jan Krapl, 078 248 91 21, jkrapl@coverd.ch</p><button class="btn-white" onclick="alert('Rückruf angefordert (Demo).')">Rückruf anfordern</button></div>
    </div>
  </div>`;
}

function profilView(){
  const pt = state.profilTab;
  const tabs = [['allg','Allgemeine Informationen'],['sicher','Sicherheit'],['benach','Benachrichtigungen']];
  const titleMap = { allg: 'Persönliche Informationen', sicher: 'Sicherheit', benach: 'Benachrichtigungen' };
  const subMap = { allg: 'Verwalten Sie Ihre persönlichen Angaben', sicher: 'Einstellungen, mit denen Sie Ihr Konto schützen', benach: 'Bestimmen Sie, worüber wir Sie informieren' };
  const notifyDefs = [['schaden','Meine Anliegen','Statusänderungen und Auszahlungen'], ['dokumente','Dokumente','Neue Policen, Rechnungen und Belege'], ['policen','Versicherungen','Mutationen und Vertragsverlängerungen'], ['news','News','Fachbeiträge und Hinweise']];
  return `
  <div style="display:flex; flex-wrap:wrap; gap:26px; align-items:flex-start;">
    <aside class="card" style="flex:1 1 280px; max-width:320px; padding:0; overflow:hidden;">
      <div style="padding:26px; display:flex; flex-direction:column; gap:14px; border-bottom:1px solid #E4E4E1;">
        <div style="width:64px; height:64px; border-radius:999px; background:#E8ECFF; color:#1F4FFF; display:grid; place-items:center; font-size:22px; font-weight:700;">NB</div>
        <div><div style="font-size:18px; font-weight:600;">Nina Brunner</div><div style="font-size:14px; color:#6E6E6B; margin-top:3px;">Privatkundin seit 2019</div></div>
        <span class="badge badge-ok" style="align-self:flex-start;">Aktiv</span>
      </div>
      <div style="padding:12px;">
        ${tabs.map(([k,l]) => `<button class="profil-tab ${pt===k?'active':''}" onclick="setProfilTab('${k}')">${l}</button>`).join('')}
      </div>
    </aside>
    <div class="card" style="flex:3 1 420px; min-width:0; padding:30px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;">
        <div><h2 style="margin:0; font-size:19px; font-weight:600;">${titleMap[pt]}</h2><p style="margin:8px 0 0; font-size:15px; color:#6E6E6B;">${subMap[pt]}</p></div>
        <button class="btn-blue-sm" onclick="alert('Gespeichert (Demo).')">Speichern</button>
      </div>
      ${pt === 'allg' ? `
      <div class="grid-fields" style="margin-top:26px;">
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">Vorname</div><input class="input" value="Nina"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">Nachname</div><input class="input" value="Brunner"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">Adresse</div><input class="input" value="Kirchgasse 14, 4600 Olten"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">Telefon</div><input class="input" value="079 512 33 08"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">E-Mail</div><input class="input" value="nina.brunner@example.ch"></div>
        <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">Sprache</div><input class="input" value="Deutsch"></div>
      </div>` : ''}
      ${pt === 'sicher' ? `
      <div style="display:flex; flex-direction:column; gap:22px; margin-top:26px;">
        <div class="grid-fields">
          <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">E-Mail für die Anmeldung</div><input class="input" value="nina.brunner@example.ch"></div>
          <div><div style="font-size:14px; font-weight:600; margin-bottom:7px;">Handynummer für die Zwei-Faktor-Anmeldung</div><input class="input" value="079 512 33 08"></div>
        </div>
        <div style="border-top:1px solid #F0F0EE; padding-top:22px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div><div style="font-size:16px; font-weight:600;">Kennwort</div><div style="font-size:14px; color:#6E6E6B; margin-top:4px;">Zuletzt geändert am 18.01.2026</div></div>
          <button class="pill-outline">Jetzt ändern</button>
        </div>
      </div>` : ''}
      ${pt === 'benach' ? `
      <div style="display:flex; flex-direction:column; margin-top:26px;">
        ${notifyDefs.map(([key,titel,sub]) => { const on = state.notify[key]; return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 0; border-bottom:1px solid #F0F0EE;">
          <div><div style="font-size:16px; font-weight:600;">${titel}</div><div style="font-size:14px; color:#6E6E6B; margin-top:4px;">${sub}</div></div>
          <button class="toggle" style="background:${on?'#1F4FFF':'#DDDDD9'}; justify-content:${on?'flex-end':'flex-start'};" onclick="toggleNotify('${key}')"><span></span></button>
        </div>`; }).join('')}
      </div>` : ''}
    </div>
  </div>`;
}

function mainBody(){
  const policy = state.policy && POLICIES.find(p => p.key === state.policy);
  const claim = state.claim && CLAIMS.find(c => c.key === state.claim);
  if (state.screen === 'dash') return dashboardView();
  if (state.screen === 'policen') return policy ? policeDetailView() : policenListView();
  if (state.screen === 'schaden') return claim ? schadenDetailView() : schadenListView();
  if (state.screen === 'dokumente') return dokumenteView();
  if (state.screen === 'news') return newsView();
  if (state.screen === 'hilfe') return hilfeView();
  if (state.screen === 'profil') return profilView();
  return dashboardView();
}

function chatWidget(){
  return `
  <div class="chatbot">
    ${state.botOpen ? `
    <div class="chat-panel">
      <div class="chat-head">
        <div style="width:10px; height:10px; border-radius:999px; background:#1F4FFF; flex:none;"></div>
        <div style="min-width:0; flex:1 1 auto;"><div style="font-size:15px; font-weight:600;">coverd Assistent</div><div style="font-size:13px; color:#6E6E6B;">Antwortet aus Ihren Policen</div></div>
        <button onclick="closeBot()" style="border:0; background:transparent; font-size:20px; color:#6E6E6B; cursor:pointer; line-height:1; padding:4px 6px;">×</button>
      </div>
      <div class="chat-messages" id="botScroll">
        ${state.messages.map(m => `<div style="display:flex; justify-content:${m.role==='user'?'flex-end':'flex-start'};"><div class="chat-bubble" style="background:${m.role==='user'?'#0A0A0B':'#F3F3F1'}; color:${m.role==='user'?'#FFFFFF':'#0A0A0B'};">${esc(m.text)}</div></div>`).join('')}
      </div>
      <div class="chat-foot">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="chip-suggest" onclick="send('Wie hoch ist meine Prämie?')">Wie hoch ist meine Prämie?</button>
          <button class="chip-suggest" onclick="send('Welche Police läuft zuerst ab?')">Welche Police läuft zuerst ab?</button>
        </div>
        <div style="display:flex; gap:10px;">
          <input id="botInput" class="input" placeholder="Frage zu Ihren Policen stellen" onkeydown="onBotKey(event)">
          <button class="btn-blue-sm" onclick="sendFromInput()">Senden</button>
        </div>
      </div>
    </div>` : ''}
    <button class="fab" onclick="toggleBot()">Fragen? Assistent öffnen</button>
  </div>`;
}

function render(){
  document.getElementById('app').innerHTML = `<div class="app-flex">${sidebar()}<div class="main-col">${topheader()}<main class="main-content">${mainBody()}</main></div></div>${chatWidget()}`;
  const sc = document.getElementById('botScroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
}

render();
</script>
</body>
</html>
