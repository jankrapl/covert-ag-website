  .chat-head{ padding:18px 22px; border-bottom:1px solid #E4E4E1; display:flex; align-items:center; gap:12px; flex:none; }
  .chat-messages{ padding:20px 22px; display:flex; flex-direction:column; gap:14px; flex:1 1 auto; min-height:180px; max-height:340px; overflow-y:auto; }

  .chat-foot{ padding:14px 22px 20px; border-top:1px solid #E4E4E1; display:flex; flex-direction:column; gap:12px; flex:none; }
  .chip-suggest{ border:1px solid #E4E4E1; background:#FFFFFF; font:inherit; font-size:13px; font-weight:500; padding:8px 13px; border-radius:999px; cursor:pointer; }

  .btn-mic{ border:1px solid #E4E4E1; background:#FFFFFF; width:46px; height:46px; min-width:46px; border-radius:12px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex:none; }
  .btn-mic.listening{ background:#FFECEC; border-color:#E23B3B; }
  .fab:hover{ background:#1F4FFF; }

    .sidebar{ width:248px; flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:0; padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .sidebar-logo{ padding:0 22px 28px; }
    .sidebar-label{ display:block; padding:0 22px 10px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#DCE8FF; }
    .sidebar-label.spaced{ padding-top:26px; }
    .sidebar-nav{ flex-direction:column; gap:2px; padding:0 12px; }
    .nav-item{ font-size:15px; padding:12px 14px; white-space:normal; }
    .sidebar-advisor{ display:flex; margin-top:auto; padding:22px 22px 0; border-top:1px solid #3B7BFF; align-items:center; gap:12px; }
    main.main-content{ padding:36px; }
    .topheader{ padding:18px 36px; }
  }
</style>

function answer(q){
  const s = q.toLowerCase();
  const hit = POLICIES.find((p) => p.tags.some((t) => s.includes(t)));
  if (/(prämie|praemie|zahle|kosten|monat|preis|total)/.test(s)) {
    if (hit) return hit.produkt + ': ' + hit.praemie + ' (' + hit.gesellschaft + ', Police ' + hit.nr + ').';
    return 'Ihre sechs Versicherungen kosten zusammen CHF 486.00 pro Monat. Grösster Posten: Krankenkasse mit CHF 289.00.';
  }
  if (/(selbstbehalt|franchise)/.test(s)) {
    return 'Ihre Selbstbehalte:\n\nKrankenkasse — Franchise CHF 2 500\nAuto (Vollkasko) — CHF 500\nHausrat — CHF 200\nPrivathaftpflicht — kein Selbstbehalt';
  }
  if (/(velo|fahrrad|gestohlen|diebstahl|einbruch)/.test(s)) {
    return 'Ja. Ihr Hausrat (Police 8814-2290, Mobiliar) deckt Diebstahl auch auswärts, Selbstbehalt CHF 200. Ein Velodiebstahl wurde im Mai 2026 mit CHF 1\'240.00 abgerechnet.';
  }
  if (/(umzug|adresse|neue wohnung)/.test(s)) {
    return 'Eine neue Adresse melden Sie bei Hausrat über den Reiter "Summe oder Adresse ändern". Wir passen Hausrat, Privathaftpflicht und die Autoversicherung gemeinsam an.';
  }
  if (/(schaden|anliegen|melden|unfall|bearbeitung)/.test(s)) {
    return 'Ein Anliegen ist in Bearbeitung: Wasserschaden Waschmaschine (Hausrat, Mobiliar, gemeldet 05.09.2026) — die Fotos sind eingereicht, die Mobiliar prüft die Kostenschätzung.';
  }
  if (/(nachricht|ungelesen)/.test(s)) {
    return 'Sie haben 2 neue Nachrichten im Verlauf auf dem Dashboard. Die jüngste ist von Jan Krapl vom 01.09.2026 zur neuen Hausratpolice.';
  }
  if (/(rechnung|fällig|faellig|zahlung)/.test(s)) {
    return 'Offen ist eine Rechnung: Autoversicherung CHF 1\'128.00, fällig am 30.09.2026.';
  }
  if (/(kündig|wechsel|frist)/.test(s)) {
    return 'Die Zusatzversicherung der Krankenkasse kann bis 30.11.2026 gekündigt werden. Hausrat und Privathaftpflicht laufen bis 31.12.2026 und verlängern sich automatisch.';
  }
  if (hit) return hit.produkt + ' bei ' + hit.gesellschaft + ' (Police ' + hit.nr + '), ' + hit.praemie + '.\n\n' + hit.deckung;
  if (/(versichert|deckung|gedeckt|abgedeckt)/.test(s)) {
    return 'Gedeckt sind Krankheit, Auto, Hausrat, Privathaftpflicht, Rechtsschutz und Vorsorge (Säule 3a). Keine Reiseversicherung — das wäre eine Lücke, wenn Sie oft verreisen.';
  }
  return 'Dazu finde ich in Ihren Policen keine Angabe. Jan Krapl hilft weiter: 078 248 91 21 oder jkrapl@coverd.ch.';
}

function send(text){
  const q = (text || '').trim();
  if (!q) return;
  state.messages.push({ role: 'user', text: q });
  const a = answer(q);
  state.messages.push({ role: 'bot', text: a });
  speak(a);
  render();
}
function sendFromInput(){
  const el = document.getElementById('botInput');
  send(el.value);
  el.value = '';
  el.focus();
}
function onBotKey(e){ if (e.key === 'Enter') sendFromInput(); }

var recognition = null;
function initRecognition(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) return null;
  const r = new Ctor();
  r.lang = 'de-CH';
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = function(e){ send(e.results[0][0].transcript); };
  r.onend = function(){ state.listening = false; render(); };
  r.onerror = function(){ state.listening = false; render(); };
  return r;
}
function toggleMic(){
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;
  if (state.listening) {
    recognition.stop();
    state.listening = false;
  } else {
    state.listening = true;
    recognition.start();
  }
  render();
}
function toggleVoiceOut(){
  state.voiceOut = !state.voiceOut;
  if (!state.voiceOut && window.speechSynthesis) window.speechSynthesis.cancel();
  render();
}
function speak(text){
  if (!state.voiceOut || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-CH';
  window.speechSynthesis.speak(u);
}

function mainBody(){

  if (state.screen === 'dash') return dashboardView();
  if (state.screen === 'policen') return policy ? policeDetailView() : policenListView();
  if (state.screen === 'schaden') return claim ? schadenDetailView() : schadenListView();
  if (state.screen === 'dokumente') return dokumenteView();
  if (state.screen === 'news') return newsView();
  if (state.screen === 'hilfe') return hilfeView();

  return dashboardView();
