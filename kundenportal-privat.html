<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kundenportal – coverd ag</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C;
    --paper:#FFFFFF;
    --flat:#F2F2F4;
    --text:#0B0B0C;
    --grey:#3A3A3E;
    --meta:#68686D;
    --line:#E4E4E7;
    --line-soft:#F2F2F4;
    --input-border:#D4D4D8;
    --accent:#3D2BFF;
    --accent-hover:#2E1CE6;
    --accent-light:#EEECFF;
    --accent-dark:#2414B8;
    --danger:#C81E1E;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--flat); font-family:'Archivo',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ color:var(--accent-hover); }
  button{ font-family:inherit; }
  input, textarea, select{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  h1,h2,h3{ font-family:'Archivo',sans-serif; margin:0; }

  /* ---- layout shell ---- */
  .app{ display:flex; flex-direction:column; min-height:100vh; background:var(--flat); }
  .main-col{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .main{ padding:20px; max-width:1240px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:24px; }

  /* ---- sidebar ---- */
  .sidebar{ width:100%; flex:none; background:var(--paper); border-bottom:1px solid var(--line); display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px; padding:14px 16px; overflow-x:auto; }
  .sidebar-logo{ padding:0; flex:none; }
  .sidebar-logo img{ height:22px; width:auto; display:block; }
  .sidebar-group-label{ display:none; }
  .sidebar-nav{ display:flex; flex-direction:row; flex-wrap:wrap; gap:4px; }
  .nav-item{ text-align:left; border:0; background:transparent; font:inherit; font-size:13px; font-weight:700; padding:9px 12px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap; color:var(--text); }
  .nav-item:hover{ background:var(--accent-light); color:var(--accent-dark); }
  .nav-item.active{ background:var(--accent-light); color:var(--accent-dark); }
  .nav-item.is-logout{ color:var(--meta); }
  .nav-count{ font-size:12px; font-weight:700; color:var(--accent); }
  .nav-item.active .nav-count{ color:var(--accent-dark); }
  .sidebar-advisor{ display:none; }
  .sidebar-advisor img{ width:40px; height:40px; border-radius:999px; object-fit:cover; object-position:50% 22%; flex:none; }

  /* ---- topheader ---- */
  .topheader{ background:var(--paper); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
  .topheader .title{ font-size:20px; font-weight:700; }
  .topheader .crumb{ font-size:13px; color:var(--meta); margin-top:2px; }
  .header-right{ display:flex; align-items:center; gap:12px; margin-left:auto; flex-wrap:wrap; }
  .header-user{ display:flex; align-items:center; gap:10px; padding-left:14px; border-left:1px solid var(--line); }
  .avatar{ width:36px; height:36px; border-radius:999px; background:var(--accent-light); color:var(--accent-dark); display:grid; place-items:center; font-size:13px; font-weight:700; flex:none; }

  /* ---- buttons ---- */
  .btn{ border:0; font:inherit; font-weight:700; font-size:15px; padding:13px 20px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:10px; white-space:nowrap; }
  .btn-primary{ background:var(--accent); color:#FFFFFF; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-dark{ background:var(--ink); color:#FFFFFF; }
  .btn-dark:hover{ background:var(--accent); }
  .btn-outline{ background:var(--paper); border:1px solid var(--line); color:var(--text); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-sm{ padding:9px 16px; font-size:13px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn-arrow{ margin-left:auto; }

  /* ---- cards ---- */
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:26px; }
  .card-flat{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:0; overflow:hidden; }
  .card-click{ cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; display:block; width:100%; text-align:left; font:inherit; }
  .card-click:hover{ border-color:var(--accent); box-shadow:0 14px 36px rgba(11,11,12,.08); }
  .card-dashed{ background:var(--paper); border:1px dashed var(--input-border); border-radius:16px; padding:26px; }

  /* ---- status / badges ---- */
  .badge{ font-size:12px; font-weight:700; border-radius:999px; padding:5px 11px; display:inline-block; white-space:nowrap; }
  .badge-active{ color:var(--accent-dark); background:var(--accent-light); }
  .badge-pending{ color:var(--meta); background:var(--flat); }
  .status-pill{ font-size:12px; font-weight:700; border-radius:999px; padding:5px 11px; white-space:nowrap; flex:none; }
  .status-pill-ready{ color:var(--accent-dark); background:var(--accent-light); }
  .status-pill-pending{ color:var(--meta); background:var(--flat); }

  .overline{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--meta); }

  /* ---- key-value rows ---- */
  .kv-grid{ display:flex; flex-direction:column; }
  .kv-row{ display:flex; gap:20px; align-items:baseline; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line-soft); }
  .kv-row:last-child{ border-bottom:0; }
  .kv-k{ flex:0 0 230px; max-width:230px; font-size:14px; color:var(--meta); overflow-wrap:break-word; }
  .kv-v{ flex:1 1 auto; min-width:0; font-size:15px; font-weight:600; overflow-wrap:break-word; text-align:right; }
  @media (max-width:640px){
    .kv-row{ flex-direction:column; gap:3px; }
    .kv-k{ flex:none; max-width:none; }
    .kv-v{ text-align:left; }
  }
  .doc-text{ margin:0; max-height:460px; overflow:auto; background:var(--flat); border:1px solid var(--line); border-radius:12px; padding:16px; font-family:'Archivo',sans-serif; font-size:12px; line-height:1.6; white-space:pre-wrap; overflow-wrap:break-word; }
  .micro{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--meta); font-weight:700; }

  /* ---- inputs ---- */
  .field-label{ font-size:14px; font-weight:700; margin-bottom:7px; }
  .input{ width:100%; height:50px; border:1px solid var(--input-border); border-radius:12px; padding:0 16px; font:inherit; font-size:15px; outline:none; background:var(--paper); color:var(--text); }
  .input:focus{ border-color:var(--accent); }
  textarea.input{ height:auto; min-height:90px; padding:14px 16px; resize:vertical; }

  /* ---- dropzone / success ---- */
  .upload-zone{ border:1px dashed #BFB8FF; background:#F7F6FF; border-radius:12px; padding:20px 16px; font-size:14px; color:var(--meta); text-align:center; }
  .success-box{ background:var(--accent-light); color:var(--accent-dark); border-radius:12px; padding:14px 16px; font-size:14px; font-weight:600; }

  /* ---- toggle switch ---- */
  .switch{ flex:none; width:46px; height:26px; border-radius:999px; border:0; cursor:pointer; padding:3px; display:flex; }
  .switch span{ width:20px; height:20px; border-radius:999px; background:#FFFFFF; display:block; }

  /* ---- tabs ---- */
  .tab-pill{ border:1px solid var(--line); background:var(--paper); color:var(--text); font:inherit; font-size:14px; font-weight:700; padding:10px 16px; border-radius:999px; cursor:pointer; }
  .tab-pill:hover{ border-color:var(--accent); color:var(--accent); }
  .tab-pill.active{ background:var(--ink); color:#FFFFFF; border-color:var(--ink); }
  .tab-pill.active:hover{ color:#FFFFFF; }

  .filter-pill{ border:1px solid var(--line); background:var(--paper); font:inherit; font-size:14px; font-weight:600; padding:10px 16px; border-radius:999px; cursor:pointer; }
  .filter-pill:hover{ border-color:var(--accent); color:var(--accent); }
  .filter-pill.active{ background:var(--ink); color:#FFFFFF; border:0; }

  .status-icon-btn{ border:0; background:transparent; color:var(--meta); font:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:4px 6px; line-height:1; }
  .status-icon-btn:hover{ color:var(--ink); }
  .status-add-btn{ align-self:flex-start; margin-top:4px; }

  /* ---- grids ---- */
  .grid-2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr)); gap:24px; align-items:start; }
  .grid-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:16px; }
  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:16px; }
  .grid-news{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:20px; }
  .grid-fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:16px; }
  .stat-strip{ border-top:1px solid var(--line); background:#FAFAFB; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr)); }
  .stat-cell{ padding:18px 28px; border-right:1px solid var(--line-soft); }

  /* ---- dashboard stat cards ---- */
  .stat-card{ display:flex; flex-direction:column; gap:10px; }
  .stat-card .stat-value{ font-size:34px; font-weight:700; letter-spacing:-0.01em; }
  .stat-card .stat-sub{ font-size:14px; color:var(--meta); }

  /* ---- chatbot ---- */
  .chatbot{ position:fixed; right:24px; bottom:24px; z-index:40; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
  .chat-panel{ width:380px; max-width:calc(100vw - 48px); max-height:calc(100vh - 130px); background:var(--paper); border-radius:20px; box-shadow:0 24px 60px rgba(11,11,12,.18); overflow:hidden; display:flex; flex-direction:column; }
  .chat-head{ padding:18px 22px; background:var(--ink); color:#FFFFFF; display:flex; align-items:center; gap:12px; flex:none; }
  .chat-messages{ padding:20px 22px; display:flex; flex-direction:column; gap:14px; flex:1 1 auto; min-height:180px; max-height:340px; overflow-y:auto; background:var(--flat); }
  .chat-bubble{ font-size:15px; line-height:1.5; border-radius:14px; padding:12px 15px; max-width:88%; white-space:pre-line; }
  .chat-bubble.bot{ background:#FFFFFF; color:var(--text); }
  .chat-bubble.user{ background:var(--accent); color:#FFFFFF; }
  .chat-foot{ padding:14px 18px 18px; background:var(--paper); display:flex; flex-direction:column; gap:12px; flex:none; }
  .chip-suggest{ border:1px solid var(--line); background:var(--paper); font:inherit; font-size:13px; font-weight:600; padding:8px 13px; border-radius:999px; cursor:pointer; }
  .chip-suggest:hover{ border-color:var(--accent); color:var(--accent); }
  .fab{ border:0; background:var(--accent); color:#FFFFFF; font:inherit; font-size:15px; font-weight:700; padding:16px 22px; border-radius:999px; cursor:pointer; box-shadow:0 12px 30px rgba(61,43,255,.35); display:flex; align-items:center; gap:10px; }
  .fab:hover{ background:var(--accent-hover); }
  .fab-dot{ width:8px; height:8px; border-radius:999px; background:#FFFFFF; flex:none; }
  .chat-input-row{ display:flex; gap:8px; align-items:center; }
  .chat-input-row .input{ flex:1 1 auto; min-width:0; border-radius:999px; }
  .round-btn{ border:1px solid var(--line); background:var(--paper); width:46px; height:46px; min-width:46px; border-radius:999px; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; flex:none; }
  .round-btn:hover{ border-color:var(--accent); }
  .round-btn.listening{ background:#FDEAEA; border-color:var(--danger); }
  .send-round{ border:0; background:var(--accent); color:#FFFFFF; width:46px; height:46px; min-width:46px; border-radius:999px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; flex:none; }
  .send-round:hover{ background:var(--accent-hover); }

  /* ---- step list (claim detail) ---- */
  .step-row{ display:flex; gap:14px; align-items:flex-start; padding-bottom:18px; }
  .step-circle{ width:22px; height:22px; border-radius:999px; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-top:1px; }
  .step-circle.done{ background:var(--accent); color:#FFFFFF; }
  .step-circle.open{ background:var(--flat); color:var(--meta); }

  /* ---- help center ---- */
  .help-hero{ background:var(--ink); color:#FFFFFF; border-radius:16px; padding:36px; }
  .help-search{ display:flex; align-items:center; gap:12px; background:#FFFFFF; border-radius:999px; padding:0 20px; margin-top:20px; max-width:620px; height:54px; }
  .help-search .input{ border:0; height:auto; padding:0; }
  .faq-item{ border-bottom:1px solid var(--line-soft); }
  .faq-item:last-child{ border-bottom:0; }
  .faq-q{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px; background:none; border:0; text-align:left; font:inherit; font-size:16px; font-weight:700; padding:16px 0; cursor:pointer; color:var(--text); }
  .faq-toggle{ color:var(--accent); font-size:18px; font-weight:700; flex:none; }
  .faq-a{ margin:0 0 16px; font-size:15px; color:var(--meta); line-height:1.6; }
  .help-blue-card{ background:var(--accent); color:#FFFFFF; border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:12px; }
  .help-blue-card .btn-white{ align-self:flex-start; margin-top:6px; border:0; background:#FFFFFF; color:var(--ink); font:inherit; font-size:14px; font-weight:700; padding:10px 18px; border-radius:999px; cursor:pointer; }
  .help-blue-card .btn-white:hover{ background:var(--ink); color:#FFFFFF; }

  /* ---- profile ---- */
  .profile-tab{ width:100%; text-align:left; border:0; background:transparent; font:inherit; font-size:15px; font-weight:600; padding:13px 16px; border-radius:12px; cursor:pointer; color:var(--text); }
  .profile-tab:hover{ background:var(--flat); }
  .profile-tab.active{ background:var(--accent-light); color:var(--accent-dark); }

  @media (min-width:901px){
    .app{ flex-direction:row; }
    .sidebar{ width:264px; flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:0; padding:28px 18px; position:sticky; top:0; height:100vh; overflow-y:auto; border-bottom:0; border-right:1px solid var(--line); }
    .sidebar-logo{ padding:0 10px 26px; }
    .sidebar-logo img{ height:24px; }
    .sidebar-group-label{ display:block; padding:0 10px 10px; font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--meta); }
    .sidebar-group-label.spaced{ padding-top:22px; }
    .sidebar-nav{ flex-direction:column; gap:2px; }
    .nav-item{ font-size:15px; padding:12px 14px; white-space:normal; justify-content:space-between; }
    .sidebar-advisor{ display:flex; margin-top:auto; padding:18px; border-radius:16px; background:var(--flat); align-items:center; gap:12px; }
    .main{ padding:36px; }
    .topheader{ padding:18px 36px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
const state = {
  loggedIn: false, loginError: false,
  screen: 'dash', policy: null, claim: null, detailTab: 'ueber', profilTab: 'allg',
  lang: 'de',
  notify: { schaden: true, policen: true, news: false },
  botOpen: false,
  listening: false,
  voiceOut: false,
  messages: [],
  policies: [],
  claims: [],
  verlauf: [],
  policyUploadBusy: false,
  themen: [],
  themaEditingId: null,
  themaEditLabel: '',
  themaEditStatus: '',
  themaEditKind: 'ready',
  uploadedDocName: null,
  uploadedDocScan: null,
  uploadedDocText: null,
  uploadedDocStatus: null
};

const NEWS = [
  { kategorie: 'Tipp', kategorieEn: 'Tip', neu: true, titel: 'Hausrat nach grösseren Anschaffungen prüfen', titelEn: 'Review home contents after major purchases', text: 'Neue Möbel, ein Instrument oder ein E-Bike heben den Wert des Haushalts schnell an. Liegt die Summe zu tief, kürzt die Versicherung im Schadenfall anteilig.', textEn: 'New furniture, an instrument or an e-bike can quickly raise the value of your household contents. If the sum insured is too low, the insurer will reduce payouts proportionally in the event of a claim.', meta: '01.09.2026 · Jan Krapl' },
  { kategorie: 'Hinweis', kategorieEn: 'Notice', neu: true, titel: 'Krankenkasse: Prämien 2027 sind da', titelEn: 'Health insurance: 2027 premiums are here', text: 'Die neuen Prämien liegen vor. Wer wechseln will, muss die Kündigung bis 30. November einreichen. Wir rechnen Ihnen die Varianten gerne durch.', textEn: "The new premiums are available. Anyone wishing to switch must submit their cancellation by November 30. We're happy to calculate the options for you.", meta: '20.08.2026 · coverd ag' },
  { kategorie: 'Recht', kategorieEn: 'Legal', neu: false, titel: 'Velo und E-Bike richtig versichern', titelEn: 'Insuring your bike and e-bike correctly', text: 'Seit dem Wegfall der Velovignette läuft die Haftpflicht über die Privathaftpflicht. Diebstahl auswärts ist nur mit entsprechender Hausratdeckung eingeschlossen.', textEn: 'Since the bicycle vignette was abolished, liability is covered through personal liability insurance. Theft away from home is only included with the appropriate home contents coverage.', meta: '12.05.2026 · coverd ag' },
  { kategorie: 'Intern', kategorieEn: 'Internal', neu: false, titel: 'Neues Kundenportal ab Oktober', titelEn: 'New customer portal from October', text: 'Änderungen, Schadenmeldungen und Dokumente laufen künftig über das Portal. Ihre bisherigen Unterlagen sind bereits übernommen.', textEn: 'Changes, claim reports and documents will now go through the portal. Your existing documents have already been transferred.', meta: '12.06.2026 · coverd ag' }
];

const STORAGE_KEY = 'coverd_privat_portal_v1';
function persist(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      policies: state.policies,
      claims: state.claims,
      verlauf: state.verlauf,
      themen: state.themen,
      notify: state.notify
    }));
  } catch (e) {}
}
function loadPersisted(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.policies) state.policies = saved.policies.filter(function(p){ return !p.reading; });
    if (saved.claims) state.claims = saved.claims;
    if (saved.verlauf) state.verlauf = saved.verlauf;
    if (saved.themen) state.themen = saved.themen;
    if (saved.notify) state.notify = saved.notify;
    persist();
  } catch (e) {}
}
function approvePolicy(key){
  const p = state.policies.find(x => x.key === key);
  if (!p) return;
  p.pending = false;
  state.verlauf.push({ initialen: 'JK', bg: '#EEECFF', fg: '#2414B8', name: 'Jan Krapl', zeit: nowStr(), text: t('Ihre Police „' + t(p.produkt, p.produktEn) + '“ wurde geprüft und ist jetzt aktiv.', 'Your "' + t(p.produkt, p.produktEn) + '" policy has been reviewed and is now active.') });
  persist();
  render();
}
function deletePolicy(key){
  const p = state.policies.find(x => x.key === key);
  if (!p) return;
  const label = t(p.produkt, p.produktEn);
  if (!confirm(p.pending
    ? t('Diese hochgeladene Police wirklich ablehnen und entfernen?','Really reject and remove this uploaded policy?')
    : t('Diese Police „' + label + '“ wirklich löschen?','Really delete the "' + label + '" policy?'))) return;
  state.policies = state.policies.filter(x => x.key !== key);
  state.verlauf.push({ initialen: 'JK', bg: '#EEECFF', fg: '#2414B8', name: 'Jan Krapl', zeit: nowStr(), text: p.pending
    ? t('Die hochgeladene Police „' + label + '“ konnte nicht bestätigt werden. Bitte laden Sie das Dokument erneut hoch oder melden Sie sich bei Jan Krapl.', 'The uploaded "' + label + '" policy could not be confirmed. Please re-upload the document or contact Jan Krapl.')
    : t('Die Police „' + label + '“ wurde auf Ihren Wunsch entfernt.', 'The "' + label + '" policy has been removed at your request.') });
  state.policy = null;
  state.screen = 'policen';
  persist();
  render();
}

function t(de, en){ return state.lang === 'en' ? en : de; }
function toggleLang(){ state.lang = state.lang === 'de' ? 'en' : 'de'; render(); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function themenCard(){
  const editingId = state.themaEditingId;
  const rows = state.themen.map(th => editingId === th.id ? themaEditRow(th) : `
    <div class="status-row" style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--line-soft);">
      <span style="font-size:15px; color:var(--text);">${esc(t(th.label, th.labelEn || th.label))}</span>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="status-pill status-pill-${th.kind}">${esc(t(th.status, th.statusEn || th.status))}</span>
        <button class="status-icon-btn" onclick="editThemaStart('${th.id}')" title="${t('Bearbeiten','Edit')}">✎</button>
        <button class="status-icon-btn" onclick="themaDelete('${th.id}')" title="${t('Entfernen','Remove')}">✕</button>
      </div>
    </div>`).join('');
  const addRow = editingId === 'new' ? themaEditRow(null) : `<button class="btn btn-outline btn-sm status-add-btn" onclick="addThemaStart()">+ ${t('Thema hinzufügen','Add topic')}</button>`;
  return `
  <div class="card" style="display:flex; flex-direction:column; gap:14px;">

function handlePolicyUpload(event){
  var file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!window.pdfjsLib) {
    state.messages.push({ role: 'bot', text: t('Dokumenten-Analyse ist gerade nicht verfügbar. Bitte später erneut versuchen.', 'Document analysis is not available right now. Please try again later.') });
    render();
    return;
  }
  state.uploadedDocName = file.name;
  state.uploadedDocText = null;
  state.uploadedDocStatus = 'loading';
  render();
  var reader = new FileReader();
  reader.onload = function(e){
    var typedarray = new Uint8Array(e.target.result);
    pdfjsLib.getDocument({ data: typedarray }).promise.then(function(pdf){
      var pagePromises = [];
      for (var i = 1; i <= pdf.numPages; i++){
        pagePromises.push(pdf.getPage(i).then(function(page){
          return page.getTextContent().then(function(tc){ return itemsToLines(tc.items); });
        }));
      }
      return Promise.all(pagePromises);
    }).then(function(pageLines){
      var lines = [];
      pageLines.forEach(function(pl){ lines = lines.concat(pl); });
      state.uploadedDocScan = scanDocumentLines(lines);
      state.uploadedDocText = state.uploadedDocScan.text;
      state.uploadedDocStatus = 'ready';
      state.messages.push({ role: 'bot', text: t(
        'Dokument „' + file.name + '“ wurde eingelesen. Sie können jetzt Fragen dazu stellen, z. B. „Wie hoch ist die Prämie?“',
        'Document "' + file.name + '" has been read. You can now ask questions about it, e.g. "What is the premium?"'
      ) });
      render();
    }).catch(function(){
      state.uploadedDocStatus = 'error';
      state.messages.push({ role: 'bot', text: t(
        'Das Dokument konnte nicht gelesen werden. Bitte versuchen Sie es mit einer anderen PDF-Datei.',
        'The document could not be read. Please try a different PDF file.'
      ) });
      render();
    });
  };
  reader.readAsArrayBuffer(file);
}

function detectProduktFromText(text){
  var s = text.toLowerCase();
  var map = [
    [/kranken|grundversicherung/, 'Krankenkasse', 'Health insurance'],
    [/fahrzeug|kasko|motorfahrzeug/, 'Autoversicherung', 'Car insurance'],
    [/hausrat/, 'Hausrat', 'Home contents insurance'],
    [/haftpflicht/, 'Privathaftpflicht', 'Personal liability insurance'],
    [/rechtsschutz/, 'Rechtsschutz', 'Legal protection insurance'],
    [/lebensversicherung|säule 3a|saule 3a/, 'Lebensversicherung', 'Life insurance'],
    [/reiseversicherung/, 'Reiseversicherung', 'Travel insurance'],
    [/gebäudeversicherung|gebaeudeversicherung/, 'Gebäudeversicherung', 'Building insurance']
  ];
  for (var i = 0; i < map.length; i++){
    if (map[i][0].test(s)) return { de: map[i][1], en: map[i][2] };
  }
  return { de: 'Versicherung', en: 'Insurance' };
}
function extractGesellschaft(text){
  var m = text.match(/([A-ZÄÖÜ][A-Za-zÄÖÜäöüß.\- ]{2,40}(Versicherung(en)?|Assurance)\s?AG)/);
  if (m) return m[1].trim();
  m = text.match(/\b(AXA|Zurich|Helvetia|Mobiliar|Allianz|Baloise|Basler|Generali|Vaudoise|Swica|CSS|Sanitas|Helsana|Visana|Concordia|Groupe Mutuel|Swiss Life|Smile|TCS|Elvia|ÖKK|Sympany|Atupri)\b/i);
  return m ? m[1] : null;
}

// --- Full document scan: rebuild real lines/columns from pdf.js position data ---
function itemsToLines(items){
  var rows = [];
  items.forEach(function(it){
    if (!it.str || !it.str.trim()) return;
    var x = it.transform[4], y = it.transform[5];
    var row = null;
    for (var i = 0; i < rows.length; i++){
      if (Math.abs(rows[i].y - y) <= 2.2) { row = rows[i]; break; }
    }
    if (!row) { row = { y: y, parts: [] }; rows.push(row); }
    row.parts.push({ x: x, w: it.width || 0, s: it.str });
  });
  rows.sort(function(a,b){ return b.y - a.y; });
  return rows.map(function(row){
    row.parts.sort(function(a,b){ return a.x - b.x; });
    var out = '', prevEnd = null;
    row.parts.forEach(function(p){
      if (prevEnd !== null){
        var gap = p.x - prevEnd;
        if (gap > 14) out += '\t';
        else if (gap > 1.2 && !/\s$/.test(out)) out += ' ';
      }
      out += p.s;
      prevEnd = p.x + p.w;
    });
    return out.replace(/[ \t]+$/,'');
  }).filter(function(l){ return l.trim(); });
}
function sClean(s){ return String(s).replace(/\s+/g,' ').trim(); }
function sLabel(s){ return String(s).replace(/\s+/g,' ').replace(/[: ]+$/,'').trim(); }
function scanDocumentLines(lines){
  var felder = [], deckungen = [], seen = {};
  function add(label, value){
    var l = sLabel(label), v = sClean(value);
    if (!l || !v) return;
    if (l.length < 2 || l.length > 70) return;
    if (/^[\d\s'’.,%-]+$/.test(l)) return;
    if (/kundenmeinungen|trustpilot/i.test(v)) return;
    if (l.toLowerCase() === v.toLowerCase()) return;
    if (v.length > 220) v = v.slice(0,220) + '…';
    var k = l.toLowerCase() + '=' + v.toLowerCase();
    if (seen[k]) return;
    seen[k] = 1;
    felder.push({ label: l, value: v });
    if (/^(nicht\s+)?versichert\b|^inklusive\b|^eingeschlossen\b/i.test(v)) {
      deckungen.push({ label: l, value: v, ok: !/^nicht/i.test(v) });
    }
  }
  lines.forEach(function(line){
    if (line.indexOf('\t') !== -1){
      var cols = line.split('\t').map(function(c){ return c.trim(); }).filter(Boolean);
      if (cols.length === 2){ add(cols[0], cols[1]); return; }
      if (cols.length >= 3){
        if (/:$/.test(cols[1])) { add(cols[1], cols.slice(2).join(' · ')); return; }
        add(cols[0], cols.slice(1).join(' · '));
        return;
      }
    }
    var m = line.match(/^([^:\t]{2,70}):\s*(.+)$/);
    if (m) add(m[1], m[2]);
  });
  var betraege = [], daten = [];
  lines.forEach(function(line){
    var cols = line.split('\t');
    var lab = sLabel(cols.length >= 3 && /:$/.test(cols[1].trim()) ? cols[1] : cols[0]);
    var mm = line.match(/CHF\s*[\d'’.,]+(?:\s*(?:Mio\.?|Mia\.?|Million(?:en)?))?/g);
    if (mm) mm.forEach(function(a){ betraege.push({ label: lab, betrag: sClean(a) }); });
    var dm = line.match(/\d{2}\.\d{2}\.\d{4}/g);
    if (dm) dm.forEach(function(d){ daten.push({ label: lab, datum: d }); });
  });
  var text = lines.join('\n');
  if (text.length > 60000) text = text.slice(0, 60000) + '\n…';
  return { felder: felder, deckungen: deckungen, betraege: betraege, daten: daten, text: text };
}
function pickScanField(felder, names){
  for (var i = 0; i < names.length; i++){
    for (var j = 0; j < felder.length; j++){
      if (felder[j].label.toLowerCase().indexOf(names[i].toLowerCase()) !== -1) return felder[j].value;
    }
  }
  return null;
}
function pickScanDate(daten, names){
  for (var i = 0; i < names.length; i++){
    for (var j = 0; j < daten.length; j++){
      if (daten[j].label.toLowerCase().indexOf(names[i].toLowerCase()) !== -1) return daten[j].datum;
    }
  }
  return null;
}
function extractPolicennummer(text){
  var m = text.match(/Police[\s-]*(?:Nr\.?|Nummer)\s*:?\s*([\d][\d.\-\/ ]{4,25}\d)/i);
  if (m) return sClean(m[1]);
  m = text.match(/(?:Policennummer|Vertragsnummer|Vertrags-Nr\.?)\s*:?\s*([A-Z0-9][\w.\-\/ ]{3,25})/i);
  return m ? sClean(m[1]) : null;
}
function extractDokumentTitel(lines){
  for (var i = 0; i < Math.min(lines.length, 12); i++){
    var l = sClean(lines[i]);
    if (/versicherung/i.test(l) && l.length < 80 && !/^www|@/.test(l)) return l;
  }
  return null;
}
function normPraemie(v){
  if (!v) return null;
  var s = sClean(v);
  if (/CHF/i.test(s)) return s;
  if (/^[\d'’.,]+$/.test(s)) return 'CHF ' + s;
  return s;
}

function handleNewPolicyUpload(event){
  var file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (!window.pdfjsLib) {
    alert(t('PDF-Analyse ist gerade nicht verfügbar. Bitte später erneut versuchen.', 'PDF analysis is not available right now. Please try again later.'));
    return;
  }
  var pendingKey = 'pending-' + Date.now();
  state.policyUploadBusy = true;
  state.policies.push({ key: pendingKey, pending: true, reading: true, produkt: t('Wird gelesen…','Reading…'), produktEn: t('Wird gelesen…','Reading…') });
  render();
  var reader = new FileReader();
  reader.onload = function(e){
    var typedarray = new Uint8Array(e.target.result);
    var seiten = 0;
    pdfjsLib.getDocument({ data: typedarray }).promise.then(function(pdf){
      seiten = pdf.numPages;
      var pagePromises = [];
      for (var i = 1; i <= pdf.numPages; i++){
        pagePromises.push(pdf.getPage(i).then(function(page){
          return page.getTextContent().then(function(tc){ return itemsToLines(tc.items); });
        }));
      }
      return Promise.all(pagePromises);
    }).then(function(pageLines){
      var lines = [];
      pageLines.forEach(function(pl){ lines = lines.concat(pl); });
      var scan = scanDocumentLines(lines);
      scan.seiten = seiten;
      scan.dateiname = file.name;
      var text = scan.text;

      var prod = detectProduktFromText(text);
      var ges = extractGesellschaft(text);
      var praemie = normPraemie(pickScanField(scan.felder, ['Total Jahresprämie','Jahresprämie','Gesamtprämie','Jahresbeitrag','Monatsprämie','Prämie in CHF','Prämie']));
      var selbst = pickScanField(scan.felder, ['Selbstbehalt','Franchise']);
      if (selbst && !/CHF|\d/.test(selbst)) selbst = null;
      var beginn = pickScanDate(scan.daten, ['Beginn','Vertragsbeginn','Gültig ab','Von']);
      var ende = pickScanDate(scan.daten, ['Ende','Vertragsende','Ablauf','Gültig bis','Bis']);
      var polNr = extractPolicennummer(text);
      var titel = extractDokumentTitel(lines);

      var idx = state.policies.findIndex(function(p){ return p.key === pendingKey; });
      if (idx !== -1) {
        state.policies[idx] = {
          key: pendingKey,
          pending: true,
          reading: false,
          produkt: prod.de, produktEn: prod.en,
          gesellschaft: ges || titel || t('Wird geprüft','Being reviewed'),
          gesellschaftEn: ges || titel || t('Wird geprüft','Being reviewed'),
          praemie: praemie || t('Wird ermittelt','To be determined'), praemieEn: praemie || t('Wird ermittelt','To be determined'),
          selbst: selbst || '—', selbstEn: selbst || '—',
          ablauf: ende || '—',
          beginn: beginn || null,
          polNr: polNr || null,
          dokTitel: titel || null,
          scan: scan,
          deckung: t('Diese Police wurde hochgeladen und vollständig eingelesen. Unter „Alle Angaben“ sehen Sie jedes erfasste Feld aus dem Dokument.','This policy was uploaded and fully scanned. Under "All details" you can see every field captured from the document.'),
          deckungEn: 'This policy was uploaded and fully scanned. Under "All details" you can see every field captured from the document.',
          mutTitel: t('Änderung anfragen','Request a change'), mutTitelEn: 'Request a change',
          felder: [],
          tags: []
        };
      }
      state.verlauf.push({ initialen: 'JK', bg: '#EEECFF', fg: '#2414B8', name: 'Jan Krapl', zeit: nowStr(), text: t('Ihre hochgeladene Police „' + prod.de + '“ wurde vollständig eingelesen (' + seiten + ' Seiten, ' + scan.felder.length + ' erfasste Angaben) und wird nun geprüft.', 'Your uploaded "' + prod.en + '" policy was fully scanned (' + seiten + ' pages, ' + scan.felder.length + ' captured details) and is now being reviewed.') });
      state.policyUploadBusy = false;
      persist();
      render();
    }).catch(function(){
      var idx = state.policies.findIndex(function(p){ return p.key === pendingKey; });
      if (idx !== -1) state.policies.splice(idx, 1);
      state.policyUploadBusy = false;
      persist();
      alert(t('Das Dokument konnte nicht gelesen werden. Bitte versuchen Sie es mit einer anderen PDF-Datei.','The document could not be read. Please try a different PDF file.'));
      render();
    });
  };
  reader.readAsArrayBuffer(file);
}

function findLabelIndex(text, labels){
  var lower = text.toLowerCase();
  for (var i = 0; i < labels.length; i++){
    var idx = lower.indexOf(labels[i].toLowerCase());
    if (idx !== -1) return idx;
  }
  return -1;
}
function extractAmountNear(text, idx, window, allowBareNumber){
  if (idx === -1) return null;
  var slice = text.substr(idx, window || 250);
  var re = /CHF\s*[\d'.,]+(?:\s*(Mio\.?|Million(?:en)?))?/g;
  var m;
  while ((m = re.exec(slice))) {
    if (m[1]) continue;
    return m[0].replace(/\s+/g, ' ').trim();
  }
  if (allowBareNumber) {
    var m2 = slice.match(/\b\d{1,3}(?:'?\d{3})*\.\d{2}\b/);
    if (m2) return 'CHF ' + m2[0];
  }
  return null;
}
function extractDatesNear(text, idx, window){
  if (idx === -1) return null;
  var slice = text.substr(idx, window || 250);
  var m = slice.match(/(\d{2}\.\d{2}\.\d{4})\D{0,40}?(\d{2}\.\d{2}\.\d{4})/);
  return m ? { von: m[1], bis: m[2] } : null;
}
function searchUploadedDoc(q){
  var text = state.uploadedDocText;
  if (!text) return null;
  var s = q.toLowerCase();
  var noteDe = ' (Automatisch erkannt aus „' + state.uploadedDocName + '“ — nicht von einem Berater geprüft.)';
  var noteEn = ' (Automatically detected from "' + state.uploadedDocName + '" — not verified by an advisor.)';

  // Prefer the structured scan: match the question against captured field labels.
  var sc = state.uploadedDocScan;
  if (sc && sc.felder && sc.felder.length) {
    var words = s.replace(/[?.,!;:]/g,' ').split(/\s+/).filter(function(w){ return w.length >= 4; });
    if (words.length) {
      var best = null, bestScore = 0;
      sc.felder.forEach(function(f){
        var lab = f.label.toLowerCase();
        var score = 0;
        words.forEach(function(w){ if (lab.indexOf(w) !== -1) score += w.length; });
        if (score > bestScore) { bestScore = score; best = f; }
      });
      if (best && bestScore >= 4) {
        return t('Laut Ihrem hochgeladenen Dokument: ' + best.label + ' — ' + best.value + '.' + noteDe,
                 'According to your uploaded document: ' + best.label + ' — ' + best.value + '.' + noteEn);
      }
    }
  }

  if (/(prämie|praemie|kosten|zahle|preis|premium|cost|price)/.test(s)) {
    var idx = findLabelIndex(text, ['Jahresprämie', 'Prämienforderung', 'Monatsprämie', 'Prämienrechnung', 'Prämie']);
    var amt = extractAmountNear(text, idx, 250, true);
    if (amt) return t('Laut Ihrem hochgeladenen Dokument beträgt die Prämie ' + amt + '.' + noteDe, 'According to your uploaded document, the premium is ' + amt + '.' + noteEn);
  }
  if (/(selbstbehalt|franchise|deductible)/.test(s)) {
    var idxSb = findLabelIndex(text, ['Selbstbehalt', 'Franchise']);
    var amtSb = extractAmountNear(text, idxSb, 250, false);
    if (amtSb) return t('Laut Ihrem hochgeladenen Dokument beträgt der Selbstbehalt ' + amtSb + '.' + noteDe, 'According to your uploaded document, the deductible is ' + amtSb + '.' + noteEn);
  }
  if (/(laufzeit|läuft|gültig|gueltig|ablauf|zeitraum|period|valid|expir|von bis)/.test(s)) {
    var idxD = findLabelIndex(text, ['Beginn', 'Vertragsdauer', 'Prämienforderung', 'Von']);
    var dates = extractDatesNear(text, idxD, 250);
    if (dates) return t('Laut Ihrem hochgeladenen Dokument läuft der Vertrag vom ' + dates.von + ' bis ' + dates.bis + '.' + noteDe, 'According to your uploaded document, the contract runs from ' + dates.von + ' to ' + dates.bis + '.' + noteEn);
  }
  if (/(gesellschaft|anbieter|versicherer|insurer|provider|wer versichert)/.test(s)) {
    var m = text.match(/([A-ZÄÖÜ][A-Za-zÄÖÜäöüß.\- ]{2,40}(Versicherung(en)?|Assurance)\s?AG)/);
    if (m) return t('Laut Ihrem hochgeladenen Dokument ist der Versicherer: ' + m[1].trim() + '.' + noteDe, 'According to your uploaded document, the insurer is: ' + m[1].trim() + '.' + noteEn);
  }
  if (/(fahrzeug|auto|bmw|car|vehicle)/.test(s)) {
    var idxF = findLabelIndex(text, ['Fahrzeugversicherung', 'Fahrzeug']);
    if (idxF !== -1) {
      var slice = text.substr(idxF, 160).replace(/\s+/g, ' ').trim();
      return t('Zu Ihrem Fahrzeug fand ich im hochgeladenen Dokument: „' + slice + '“.' + noteDe, 'Regarding your vehicle, I found this in your uploaded document: "' + slice + '".' + noteEn);
    }
  }
  return null;
}

function answer(q){
  const docAnswer = searchUploadedDoc(q);
  if (docAnswer) return docAnswer;
  const s = q.toLowerCase();
  const prod = (p) => t(p.produkt, p.produktEn);
  const praemieTxt = (p) => t(p.praemie, p.praemieEn);
  const noPolicies = t('Sie haben noch keine Policen hochgeladen. Laden Sie Ihre erste Police unter „Meine Versicherungen“ hoch, damit ich dazu Fragen beantworten kann.', 'You haven\'t uploaded any policies yet. Upload your first policy under "My Insurance" so I can answer questions about it.');
  const hit = state.policies.find((p) => !p.reading && (p.tags || []).some((tag) => s.includes(tag)));
  if (/(prämie|praemie|zahle|kosten|monat|preis|total|premium|cost|price|month)/.test(s)) {
    if (hit) return prod(hit) + ': ' + praemieTxt(hit) + ' (' + t(hit.gesellschaft, hit.gesellschaftEn) + ').';
    if (state.policies.length === 0) return noPolicies;
    return t('Ihre Versicherungen kosten zusammen ' + fmtChf(totalMonthlyPremium()) + ' pro Monat.', 'Your insurance policies cost a total of ' + fmtChf(totalMonthlyPremium()) + ' per month.');
  }
  if (/(selbstbehalt|franchise|deductible)/.test(s)) {
    if (state.policies.length === 0) return noPolicies;
    const lines = state.policies.filter(p => !p.reading).map(p => prod(p) + ' — ' + t(p.selbst, p.selbstEn));
    return lines.length ? t('Ihre Selbstbehalte:\n\n','Your deductibles:\n\n') + lines.join('\n') : noPolicies;
  }
  if (/(velo|fahrrad|gestohlen|diebstahl|einbruch|bike|bicycle|stolen|theft|burglary)/.test(s)) {
    const hausrat = state.policies.find(p => !p.reading && /hausrat|home contents/i.test(p.produkt + ' ' + (p.produktEn||'')));
    if (hausrat) return t('Ja. Ihre ' + hausrat.produkt + ' deckt Diebstahl auch auswärts, Selbstbehalt ' + t(hausrat.selbst, hausrat.selbstEn) + '.', 'Yes. Your ' + hausrat.produktEn + ' covers theft away from home too, deductible ' + t(hausrat.selbst, hausrat.selbstEn) + '.');
    return t('Dazu finde ich keine passende Police. Laden Sie Ihre Hausratversicherung hoch, damit ich das prüfen kann.', "I can't find a matching policy for that. Upload your home contents insurance so I can check.");
  }
  if (/(umzug|adresse|neue wohnung|move|moving|address)/.test(s)) {
    return t('Eine neue Adresse melden Sie am besten direkt bei Jan Krapl — er passt die betroffenen Policen für Sie an.', 'You can report a new address directly to Jan Krapl — he will update the affected policies for you.');
  }
  if (/(schaden|anliegen|melden|unfall|bearbeitung|claim|report|accident|progress)/.test(s)) {
    const offen = state.claims.find(c => /bearbeitung|progress/i.test(c.status + ' ' + (c.statusEn||'')));
    if (offen) return t('Ein Anliegen ist in Bearbeitung: ' + offen.titel + '.', 'One request is in progress: ' + (offen.titelEn || offen.titel) + '.');
    return t('Aktuell ist kein Anliegen in Bearbeitung.', 'There is currently no request in progress.');
  }
  if (/(nachricht|ungelesen|message|unread)/.test(s)) {
    if (state.verlauf.length === 0) return t('Im Verlauf auf dem Dashboard sind noch keine Nachrichten vorhanden.', "There aren't any messages in the dashboard history yet.");
    const last = state.verlauf[state.verlauf.length - 1];
    return t('Die jüngste Nachricht im Verlauf ist von ' + last.name + ' vom ' + last.zeit + '.', 'The most recent message in the history is from ' + last.name + ' on ' + last.zeit + '.');
  }
  if (/(rechnung|fällig|faellig|zahlung|invoice|due|payment)/.test(s)) {
    return t('Aktuell ist bei uns keine offene Rechnung hinterlegt.', 'There is currently no outstanding invoice on file.');
  }
  if (/(kündig|wechsel|frist|cancel|switch|notice)/.test(s)) {
    return t('Kündigungsfristen hängen von der jeweiligen Police ab. Öffnen Sie die gewünschte Police unter „Meine Versicherungen“ oder fragen Sie direkt bei Jan Krapl nach.', 'Notice periods depend on the specific policy. Open the policy under "My Insurance" or ask Jan Krapl directly.');
  }
  if (hit) return prod(hit) + ' (' + t(hit.gesellschaft, hit.gesellschaftEn) + '), ' + praemieTxt(hit) + '.\n\n' + t(hit.deckung, hit.deckungEn);
  if (/(versichert|deckung|gedeckt|abgedeckt|insured|coverage|covered)/.test(s)) {
    if (state.policies.length === 0) return noPolicies;
    const list = state.policies.filter(p => !p.reading).map(prod).join(', ');
    return list ? t('Gedeckt sind: ' + list + '.', 'Covered: ' + list + '.') : noPolicies;
  }
  return t('Dazu finde ich in Ihren Policen keine Angabe. Jan Krapl hilft weiter: 078 248 91 21 oder jkrapl@coverd.ch.', "I can't find that in your policies. Jan Krapl can help further: 078 248 91 21 or jkrapl@coverd.ch.");
}

function send(text){
  const q = (text || '').trim();
  if (!q) return;
  state.messages.push({ role: 'user', text: q });
  const a = answer(q);
  state.messages.push({ role: 'bot', text: a });
  speak(a);
  render();
}
function sendFromInput(){
  const el = document.getElementById('botInput');
  send(el.value);
  el.value = '';
  el.focus();
}
function onBotKey(e){ if (e.key === 'Enter') sendFromInput(); }

var recognition = null;
function initRecognition(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) return null;
  const r = new Ctor();
  r.lang = 'de-CH';
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = function(e){ send(e.results[0][0].transcript); };
  r.onend = function(){ state.listening = false; render(); };
  r.onerror = function(){ state.listening = false; render(); };
  return r;
}
function toggleMic(){
  if (!recognition) recognition = initRecognition();
  if (!recognition) return;
  if (state.listening) {
    recognition.stop();
    state.listening = false;
  } else {
    state.listening = true;
    recognition.start();
  }
  render();
}
function toggleVoiceOut(){
  state.voiceOut = !state.voiceOut;
  if (!state.voiceOut && window.speechSynthesis) window.speechSynthesis.cancel();
  render();
}
function speak(text){
  if (!state.voiceOut || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-CH';
  window.speechSynthesis.speak(u);
}

      <div style="padding:26px; display:flex; flex-direction:column; gap:14px; border-bottom:1px solid var(--line);">
        <div style="width:52px; height:52px; border-radius:999px; background:var(--accent-light); color:var(--accent-dark); display:grid; place-items:center; font-size:19px; font-weight:700;">AM</div>
        <div><div style="font-size:18px; font-weight:700;">Alex Muster</div><div style="font-size:14px; color:var(--meta); margin-top:3px;">${t('Privatkundin seit 2019','Private customer since 2019')}</div></div>
        <span class="badge badge-active" style="align-self:flex-start;">${t('Aktiv','Active')}</span>
      </div>
      <div style="padding:12px;">
        ${tabs.map(([k,l]) => `<button class="profile-tab ${pt===k?'active':''}" onclick="setProfilTab('${k}')">${l}</button>`).join('')}
      </div>
    </aside>
    <div class="card" style="flex:3 1 420px; min-width:0; padding:30px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;">
        <div><h2 style="font-size:22px; font-weight:700;">${titleMap[pt]}</h2><p style="margin:8px 0 0; font-size:15px; color:var(--meta);">${subMap[pt]}</p></div>
        <button class="btn btn-primary btn-sm" onclick="alert(t('Gespeichert ✓ (Demo).','Saved ✓ (demo).'))">${t('Speichern','Save')}</button>
      </div>
      ${pt === 'allg' ? `
      <div class="grid-fields" style="margin-top:26px;">
        <div><div class="field-label">${t('Vorname','First name')}</div><input class="input" value="Alex"></div>
        <div><div class="field-label">${t('Nachname','Last name')}</div><input class="input" value="Muster"></div>
        <div><div class="field-label">${t('Adresse','Address')}</div><input class="input" value="Musterstrasse 1"></div>
        <div><div class="field-label">${t('PLZ und Ort','Postal code and city')}</div><input class="input" value="4600 Olten"></div>
        <div><div class="field-label">${t('Telefon','Phone')}</div><input class="input" value="079 000 00 00"></div>
        <div><div class="field-label">${t('E-Mail','Email')}</div><input class="input" value="alex.muster@example.ch"></div>
      </div>` : ''}
      ${pt === 'sicher' ? `
      <div style="display:flex; flex-direction:column; gap:22px; margin-top:26px;">
        <div class="grid-fields">
          <div><div class="field-label">${t('E-Mail für die Anmeldung','Login email')}</div><input class="input" value="alex.muster@example.ch"></div>
          <div><div class="field-label">${t('Handynummer für die Zwei-Faktor-Anmeldung','Phone number for two-factor login')}</div><input class="input" value="079 000 00 00"></div>
        </div>
        <div style="border-top:1px solid var(--line-soft); padding-top:22px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div><div style="font-size:16px; font-weight:700;">${t('Kennwort','Password')}</div><div style="font-size:14px; color:var(--meta); margin-top:4px;">${t('Zuletzt geändert am 11.03.2026','Last changed on 11.03.2026')}</div></div>
          <button class="btn btn-outline btn-sm">${t('Jetzt ändern','Change now')}</button>
        </div>
      </div>` : ''}
      ${pt === 'benach' ? `
      <div style="display:flex; flex-direction:column; margin-top:26px;">
        ${notifyDefs.map(([key,titel,sub]) => { const on = state.notify[key]; return `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 0; border-bottom:1px solid var(--line-soft);">
          <div><div style="font-size:16px; font-weight:700;">${titel}</div><div style="font-size:14px; color:var(--meta); margin-top:4px;">${sub}</div></div>
          <button class="switch" style="background:${on?'var(--accent)':'var(--input-border)'}; justify-content:${on?'flex-end':'flex-start'};" onclick="toggleNotify('${key}')"><span></span></button>
        </div>`; }).join('')}
      </div>` : ''}
    </div>
  </div>`;
}

function mainBody(){
  const policy = state.policy && state.policies.find(p => p.key === state.policy);
  const claim = state.claim && state.claims.find(c => c.key === state.claim);
  if (state.screen === 'dash') return dashboardView();
  if (state.screen === 'policen') return policy ? policeDetailView() : policenListView();
  if (state.screen === 'schaden') return claim ? schadenDetailView() : schadenListView();
  if (state.screen === 'news') return newsView();
  if (state.screen === 'hilfe') return hilfeView();
  if (state.screen === 'profil') return profilView();
  return dashboardView();
}

function chatWidget(){
  const greeting = { role: 'bot', text: t('Guten Tag. Ich beantworte Fragen zu Ihren Versicherungen — Prämien, Deckungen, Selbstbehalte. Für alles Weitere ist Jan Krapl da.', 'Good afternoon. I can answer questions about your insurance policies — premiums, coverage, deductibles. For everything else, Jan Krapl is here to help.') };
  const msgs = [greeting, ...state.messages];
  return `
  <div class="chatbot">
    ${state.botOpen ? `
    <div class="chat-panel">
      <div class="chat-head">
        <div style="width:10px; height:10px; border-radius:999px; background:#6B5BFF; flex:none;"></div>
        <div style="min-width:0; flex:1 1 auto;"><div style="font-size:15px; font-weight:700;">${t('coverd Assistent','coverd Assistant')}</div><div style="font-size:13px; color:#C9C5FF;">${t('Antwortet aus Ihren Policen','Answers using your policies')}</div></div>
        <button onclick="toggleVoiceOut()" title="${state.voiceOut ? t('Antworten nicht mehr vorlesen','Stop reading answers aloud') : t('Antworten vorlesen','Read answers aloud')}" style="border:0; background:transparent; font-size:18px; color:#FFFFFF; cursor:pointer; line-height:1; padding:4px 6px; opacity:${state.voiceOut ? 1 : 0.5};">${state.voiceOut ? '🔊' : '🔈'}</button>
        <button onclick="closeBot()" style="border:0; background:transparent; font-size:20px; color:#FFFFFF; cursor:pointer; line-height:1; padding:4px 6px;">×</button>
      </div>
      ${state.uploadedDocName ? `
      <div style="padding:10px 22px; background:var(--flat); display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; color:var(--meta);">
        <span>📄 ${esc(state.uploadedDocName)}${state.uploadedDocStatus === 'loading' ? ' — ' + t('wird gelesen…', 'reading…') : state.uploadedDocStatus === 'error' ? ' — ' + t('Fehler','error') : ''}</span>
        <button onclick="clearUploadedDoc()" title="${t('Dokument entfernen','Remove document')}" style="border:0; background:transparent; cursor:pointer; color:var(--meta); font-size:14px; flex:none;">✕</button>
      </div>` : ''}
      <div class="chat-messages" id="botScroll">
        ${msgs.map(m => `<div style="display:flex; justify-content:${m.role==='user'?'flex-end':'flex-start'};"><div class="chat-bubble ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div></div>`).join('')}
      </div>
      <div class="chat-foot">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="chip-suggest" onclick="send('${t('Ist mein Velo versichert?','Is my bike insured?')}')">${t('Ist mein Velo versichert?','Is my bike insured?')}</button>
          <button class="chip-suggest" onclick="send('${t('Wie hoch ist mein Selbstbehalt?','What is my deductible?')}')">${t('Wie hoch ist mein Selbstbehalt?','What is my deductible?')}</button>
        </div>
        <div class="chat-input-row">
          <input id="botInput" class="input" placeholder="${state.listening ? t('Ich höre zu …','Listening…') : t('Frage zu Ihren Versicherungen stellen','Ask a question about your insurance')}" onkeydown="onBotKey(event)">
          <input type="file" id="policyUploadInput" accept="application/pdf" style="display:none;" onchange="handlePolicyUpload(event)">
          <button class="round-btn" onclick="document.getElementById('policyUploadInput').click()" title="${t('Policendokument hochladen (PDF)','Upload policy document (PDF)')}">📎</button>
          ${(window.SpeechRecognition || window.webkitSpeechRecognition) ? `<button class="round-btn ${state.listening ? 'listening' : ''}" onclick="toggleMic()" title="${state.listening ? t('Aufnahme stoppen','Stop recording') : t('Frage per Sprache stellen','Ask a question by voice')}">${state.listening ? '⏹️' : '🎤'}</button>` : ''}
          <button class="send-round" onclick="sendFromInput()" title="${t('Senden','Send')}">➤</button>
        </div>
      </div>
    </div>` : ''}
    <button class="fab" onclick="toggleBot()"><span class="fab-dot"></span>${t('Fragen? Assistent','Questions? Assistant')}</button>
  </div>`;
}

function render(){
  document.title = t('Kundenportal – coverd ag','Customer Portal – coverd ag');
  if (!state.loggedIn) {
    document.getElementById('app').innerHTML = loginView();
    return;
  }
  document.getElementById('app').innerHTML = `<div class="app">${sidebar()}<div class="main-col">${topheader()}<main class="main">${mainBody()}</main></div></div>${chatWidget()}`;
  const sc = document.getElementById('botScroll');
  if (sc) sc.scrollTop = sc.scrollHeight;
}

loadPersisted();
render();
</script>
</body>
</html>
